<title>Taktik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: coaching playbook — tab bar, then either a lesson library (cards by position) or a board view with narration under the pitch */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#13201b; --muted:#5d6e66; --line:#d5ddd8;
  --accent:#0f6b54; --accent-ink:#ffffff; --bad:#c2412b; --good:#16794f;
  --display:'Archivo','Arial Narrow',sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1411; --surface:#131e19; --ink:#e4ede8; --muted:#90a39a; --line:#25352d;
  --accent:#5fd3a5; --accent-ink:#06231a; --bad:#ff8a73; --good:#6fe0a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#131e19; --ink:#e4ede8; --muted:#90a39a; --line:#25352d;
  --accent:#5fd3a5; --accent-ink:#06231a; --bad:#ff8a73; --good:#6fe0a8; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;margin:0;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.01em;margin:0;line-height:1}
h1 small{display:block;font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:600 13px var(--body)}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:700 15px var(--body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.packhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.packhead h2{font-family:var(--display);font-size:20px;margin:0}
.packhead span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-width:0}
.lcard:hover{border-color:var(--accent)}
.lcard b{font-family:var(--display);font-size:17px;line-height:1.2}
.lcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.soon{color:var(--muted);font-size:14px;margin:0}
.boardbox{display:flex;flex-direction:column;gap:10px}
.back{align-self:flex-start;background:none;border:0;color:var(--accent);font:700 14px var(--body);cursor:pointer;padding:4px 0}
.ltitle{font-family:var(--display);font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
canvas{display:block;width:100%;border-radius:10px;touch-action:manipulation}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg button{background:var(--surface);border:0;padding:8px 14px;font:700 14px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"].w{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].r{background:var(--good);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--accent);color:var(--accent-ink)}
.narr{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;min-height:56px;font-size:17px;line-height:1.45}
.narr.bad{border-left-color:var(--bad)} .narr.good{border-left-color:var(--good)}
.narr .k{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:700 15px var(--body);color:var(--ink);cursor:pointer;min-width:48px}
.cbtn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cbtn:disabled{opacity:.4}
.dots{display:flex;gap:5px;margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:5px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.45}
.role b{font-family:var(--display)}
#vLesson,#cvL{touch-action:pan-y}
.quizgo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:14px 16px;cursor:pointer}
.quizgo b{font-family:var(--display);font-size:19px}
.quizgo span{font-size:14px;opacity:.9}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qrow .cbtn{width:100%}
.qrow .cbtn[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
#qAfter{grid-template-columns:1fr}
.score{font-family:var(--display);font-size:44px;line-height:1;color:var(--accent);display:block;margin:4px 0}
.frow{display:flex;gap:8px;align-items:center;min-width:0}
.flab{flex:0 0 auto;width:64px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.frow .chips{flex-wrap:nowrap;overflow-x:auto;min-width:0;padding-bottom:2px;scrollbar-width:none}
.frow .chip{flex:0 0 auto}
.lmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 7px;background:var(--accent);color:var(--accent-ink)}
.badge.lv{background:none;border:1px solid var(--line);color:var(--ink)}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.lnav .hint{font-size:12px;color:var(--muted);text-align:center}
.slide-n{animation:sn .28s ease-out}.slide-p{animation:sp .28s ease-out}
@keyframes sn{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes sp{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Taktik<small data-i="sub"></small></h1>
    <select id="lang" aria-label="Language"><option value="tr">TR</option><option value="de">DE</option><option value="en">EN</option><option value="fr">FR</option></select>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabL" role="tab" data-i="lessons"></button>
    <button class="tab" id="tabF" role="tab" data-i="formations"></button>
  </div>

  <section id="vList">
    <div class="boardbox">
      <div class="frow"><span class="flab" data-i="phase"></span><div class="chips" id="chP"></div></div><div class="frow"><span class="flab" data-i="level"></span><div class="chips" id="chV"></div></div><div class="frow"><span class="flab" data-i="pos"></span><div class="chips" id="chips"></div></div>
      <button class="quizgo" id="quizGo"><b data-i="quiz"></b><span id="quizSub"></span></button>
      <div class="packhead"><h2 data-i="pack"></h2><span id="count"></span></div>
      <div class="grid" id="grid"></div>
      <p class="soon" data-i="soon"></p>
    </div>
  </section>

  <section id="vLesson" hidden>
    <div class="boardbox" id="lbox">
      <button class="back" id="back">← <span data-i="backAll"></span></button>
      <div class="lmeta" id="lMeta"></div><h2 class="ltitle" id="lTitle"></h2>
      <div class="seg" id="variant"><button class="w" id="vBad" data-i="wrong"></button><button class="r" id="vGood" data-i="right"></button></div>
      <canvas id="cvL" aria-label="Board"></canvas>
      <div class="legend"><span><i style="background:#ffffff;border:1px solid #9aa"></i><span data-i="us"></span></span><span><i style="background:#e4573d"></i><span data-i="them"></span></span><span><i style="background:#f5b83d"></i><span data-i="moves"></span></span></div>
      <div class="narr" id="narr" aria-live="polite"></div>
      <div class="ctrl">
        <button class="cbtn" id="prev" aria-label="Prev">◀</button>
        <button class="cbtn main" id="play"></button>
        <button class="cbtn" id="next" aria-label="Next">▶</button>
        <div class="dots" id="dots"></div>
      </div>
      <div class="lnav"><button class="cbtn" id="pl">‹ <span data-i="prevL"></span></button><span class="hint" data-i="swipe"></span><button class="cbtn" id="nl"><span data-i="nextL"></span> ›</button></div>
    </div>
  </section>

  <section id="vQuiz" hidden>
    <div class="boardbox">
      <button class="back" id="qBack">← <span data-i="backAll"></span></button>
      <div class="lmeta" id="qMeta"></div>
      <h2 class="ltitle" id="qTitle"></h2>
      <canvas id="cvQ" aria-label="Board"></canvas>
      <div class="narr" id="qNarr" aria-live="polite"></div>
      <div class="qrow" id="qOpts"><button class="cbtn" id="qA"></button><button class="cbtn" id="qB"></button></div>
      <div class="qrow" id="qPick"><button class="cbtn main" id="qPA"></button><button class="cbtn main" id="qPB"></button></div>
      <div class="qrow" id="qAfter" hidden><button class="cbtn main" id="qNext"></button></div>
      <div class="qrow" id="qEndBtns" hidden><button class="cbtn main" id="qAgain"></button><button class="cbtn" id="qHome"></button></div>
    </div>
  </section>

  <section id="vForm" hidden>
    <div class="boardbox">
      <div class="chips" id="fchips"></div>
      <div class="seg" id="phase"><button class="n" id="pDef" data-i="defense"></button><button class="n" id="pAtt" data-i="attack"></button></div>
      <canvas id="cvF" aria-label="Formation"></canvas>
      <div class="role" id="role"></div>
    </div>
  </section>
</div>

de:{GK:['Raum hinter der Kette sichern und die Kette dirigieren.','Im Aufbau mitspielen, kurze und lange Option sehen.'],CB:['Kette gemeinsam halten, den Stürmer kontrollieren.','Breit machen, andribbeln oder linienbrechend passen.'],FB:['Flügel schließen, Abstand zum Innenverteidiger halten.','Hinterlaufen. Zieht der Flügel nach innen, gehört dir die Linie.'],WB:['In die Fünferkette fallen, Flügelspieler stellen.','Du gibst die Breite über die ganze Seite.'],DM:['Raum vor der Abwehr schützen, Passwege schließen.','Zwischen oder vor die Innenverteidiger kommen, Spiel lenken.'],CM:['Kompakt bleiben, Zentrum schließen, Pressing auslösen.','In den Halbräumen anbieten, in den Strafraum starten.'],AM:['Den gegnerischen Sechser im Deckungsschatten halten.','Zwischen den Linien anbieten, den letzten Pass suchen.'],W:['Vor dem Außenverteidiger schließen, gegnerischen AV verfolgen.','Je nach Hinterlaufen breit bleiben oder nach innen ziehen.'],ST:['Pressing starten, Spiel auf eine Seite lenken.','Innenverteidiger binden, in die Tiefe starten.']},

fr:{GK:['Protège l’espace derrière la ligne et organise-la.','Participe à la relance, vois l’option courte et longue.'],CB:['Tiens la ligne ensemble, contrôle l’attaquant.','Écarte-toi, conduis le ballon ou casse une ligne par la passe.'],FB:['Ferme le côté, garde la distance avec ton central.','Déborde. Si l’ailier rentre, la ligne de touche est à toi.'],WB:['Recule dans la ligne à cinq, affronte l’ailier.','Tu donnes la largeur sur tout le couloir.'],DM:['Protège la défense, ferme les lignes de passe.','Décroche entre ou devant les centraux, oriente le jeu.'],CM:['Reste compact, ferme l’axe, déclenche le pressing.','Offre des angles dans les demi-espaces, attaque la surface.'],AM:['Garde leur numéro 6 dans ton ombre.','Reçois entre les lignes, cherche la dernière passe.'],W:['Ferme devant ton latéral, suis leur latéral.','Reste large ou rentre, selon le dédoublement.'],ST:['Lance le pressing, oriente le jeu d’un côté.','Fixe les centraux, attaque la profondeur.']}
};

{id:'markaj',phase:'def',lvl:1,tags:['FB','CB'],view:'def',
 title:L('Markaj: adamla kale arasında dur','Deckung: zwischen Gegner und Tor','Marking: stay goal-side','Marquage : entre l’adversaire et le but'),
 sum:L('İç omuz, doğru mesafe, hem adamı hem topu görmek.','Innere Schulter, richtiger Abstand, Mann und Ball sehen.','Inside shoulder, right distance, see man and ball.','Épaule intérieure, bonne distance, voir l’homme et le ballon.'),
 actors:[['2','us',54,76],['5','us',42,79],['4','us',28,79],['M','op',38,57],['W','op',58,68]],ball:'M',
 intro:{txt:L('Rakip kanat topsuz. Bek (2) onu kontrol ediyor.','Der gegnerische Flügel ist ohne Ball. Außenverteidiger (2) kontrolliert ihn.','Their winger is off the ball. Full-back (2) is watching him.','L’ailier adverse est sans ballon. Le latéral (2) le surveille.')},
 good:[
  {p:{M:[41,60],W:[59,71],'2':[55,76]},arrows:[[59,71,34,105,'guide']],txt:L('Doğru konum: adamla kale arasında, iç omuzda. Hem adamı hem topu görüyorsun.','Richtig: zwischen Gegner und Tor, an der inneren Schulter. Du siehst Mann und Ball.','Right: between man and goal, on his inside shoulder. You see man and ball.','Juste : entre l’homme et le but, à l’épaule intérieure. Tu vois l’homme et le ballon.')},
  {p:{W:[59,73],'2':[57,76]},ball:'W',arrows:[[41,60,59,73,'pass']],txt:L('Pas yoldayken yaklaş. Top ayağa geldiğinde bir kol mesafesindesin.','Rück heran, solange der Pass unterwegs ist. Bei der Annahme bist du eine Armlänge entfernt.','Close in while the pass travels. When it arrives you are an arm’s length away.','Approche pendant que la passe voyage. À la réception, tu es à une longueur de bras.')},
  {p:{W:[62,82],'2':[59,83]},arrows:[[59,73,62,82,'run']],txt:L('İçeriyi kapattığın için rakip dışarı, daha az tehlikeli bölgeye gidiyor.','Weil du innen zu machst, muss er nach außen in die ungefährlichere Zone.','Because you shut the inside, he has to go wide, into less danger.','Comme tu fermes l’intérieur, il doit partir à l’extérieur, moins dangereux.')}],
 bad:[
  {p:{M:[41,60],W:[60,80],'2':[50,74]},arrows:[[59,68,60,80,'run']],txt:L('Hata: bek sadece topa bakıyor. Adam arkasına koşuyor.','Fehler: Der AV schaut nur auf den Ball. Der Gegner läuft in seinen Rücken.','Mistake: the full-back only watches the ball. His man runs in behind.','Erreur : le latéral ne regarde que le ballon. Son joueur file dans son dos.')},
  {p:{W:[60,85],'2':[54,80]},ball:'W',arrows:[[41,60,60,85,'pass']],txt:L('Pas savunma arkasına gidiyor. Bek yarışı geride başlıyor.','Der Pass geht hinter die Abwehr. Der AV startet das Laufduell von hinten.','The pass goes in behind. The full-back starts the race from behind.','La passe part dans le dos. Le latéral démarre la course en retard.')},
  {p:{W:[48,93],'2':[54,88]},arrows:[[60,85,48,93,'run']],txt:L('Rakip kaleye doğru serbest kalıyor.','Der Gegner läuft frei aufs Tor zu.','He is free, heading for goal.','Il est libre et file vers le but.')}]},

{id:'alan',phase:'def',lvl:1,tags:['CB','FB','DM'],view:'def',
 title:L('Alan savunması: dörtlü kayma','Raumdeckung: die Viererkette verschieben','Zonal defending: the back four shift','Défense de zone : la ligne de quatre coulisse'),
 sum:L('Top kanada gidince hat birlikte kayar, uzak bek içeri daralır.','Geht der Ball auf den Flügel, verschiebt die Kette, der ballferne AV rückt ein.','Ball goes wide, the line shifts together and the far full-back tucks in.','Ballon sur le côté : la ligne coulisse, le latéral opposé resserre.'),
 actors:[['3','us',14,78],['4','us',28,80],['5','us',40,80],['2','us',54,78],['6','us',34,69],['M','op',34,57],['R','op',20,66],['A','op',60,62]],ball:'M',
 intro:{txt:L('Dörtlü savunma ve 6 numara topun konumuna göre birlikte hareket eder.','Viererkette und Sechser bewegen sich gemeinsam nach der Ballposition.','The back four and the 6 move together according to where the ball is.','La ligne de quatre et le 6 bougent ensemble selon la position du ballon.')},
 good:[
  {p:{A:[60,64],'2':[57,70],'5':[46,77],'4':[35,79],'3':[25,78],'6':[42,68]},ball:'A',arrows:[[34,57,60,64,'pass']],txt:L('Top kanada gidiyor. Bek (2) baskıya çıkar, diğerleri topa doğru kayar, uzak bek (3) içeri daralır.','Der Ball geht auf den Flügel. AV (2) presst, die anderen verschieben, der ballferne AV (3) rückt ein.','The ball goes wide. Full-back (2) presses, the rest shift across, the far full-back (3) tucks in.','Le ballon va sur le côté. Le latéral (2) presse, les autres coulissent, le latéral opposé (3) resserre.')},
  {p:{R:[22,82],'3':[23,82]},arrows:[[20,66,22,82,'run']],txt:L('Arkaya koşan rakip, içeri daralmış bek tarafından karşılanıyor.','Der Läufer in die Tiefe wird vom eingerückten AV aufgenommen.','The runner in behind is picked up by the tucked-in full-back.','Le coureur dans la profondeur est pris par le latéral resserré.')},
  {p:{A:[62,60],M:[36,56],'2':[54,76],'5':[40,80],'4':[28,80],'3':[16,79],'6':[34,69]},ball:'M',arrows:[[60,64,36,56,'pass']],txt:L('Top geri merkeze gelince hat yeniden ortalanır. Aralar 8–10 metreyi geçmez.','Kommt der Ball zurück ins Zentrum, zentriert sich die Kette wieder. Abstände bleiben bei 8–10 Metern.','When the ball returns centrally, the line re-centres. Gaps stay at 8–10 metres.','Ballon de retour dans l’axe : la ligne se recentre. Les écarts restent de 8 à 10 m.')}],
 bad:[
  {p:{A:[60,64],'2':[57,70],'5':[46,77],'4':[30,80],'3':[12,78],'6':[42,68]},ball:'A',arrows:[[34,57,60,64,'pass']],zone:[22,80,5,'bad'],txt:L('Hata: uzak bek (3) geniş kalıyor. Stoperle arasında boşluk açılıyor.','Fehler: Der ballferne AV (3) bleibt breit. Zwischen ihm und dem IV entsteht eine Lücke.','Mistake: the far full-back (3) stays wide. A gap opens next to the centre-back.','Erreur : le latéral opposé (3) reste large. Un trou s’ouvre à côté du central.')},
  {p:{R:[22,84]},arrows:[[20,66,22,84,'run']],zone:[22,82,5,'bad'],txt:L('Rakip tam o boşluğa koşuyor.','Der Gegner läuft genau in diese Lücke.','The opponent runs straight into that gap.','L’adversaire attaque exactement ce trou.')},
  {p:{R:[26,92]},ball:'R',arrows:[[60,64,22,84,'pass']],txt:L('Çapraz pas boşluğu buluyor. Kayma eksik kaldı.','Der Diagonalball findet die Lücke. Das Verschieben war unvollständig.','The diagonal ball finds the gap. The shift was incomplete.','Le ballon en diagonale trouve le trou. Le coulissement était incomplet.')}]},

{id:'adam',phase:'def',lvl:1,tags:['CB'],view:'def',
 title:L('Adam adama savunma','Manndeckung','Man-to-man defending','Défense individuelle'),
 sum:L('Herkes bir rakibe bağlı; çapraz koşuda adamını bırakma.','Jeder hat seinen Gegner; bei Kreuzläufen nicht loslassen.','Everyone has a man; don’t lose him on crossing runs.','Chacun son joueur ; ne le lâche pas sur les courses croisées.'),
 actors:[['4','us',28,80],['5','us',40,80],['X','op',38,74],['Y','op',27,73],['M','op',34,56]],ball:'M',
 intro:{txt:L('İki stoper de bir rakibe bağlı. Rakip nereye giderse takip eder.','Beide IV haben einen festen Gegenspieler und folgen ihm überallhin.','Each centre-back has one man and follows him wherever he goes.','Chaque central a son joueur et le suit partout.')},
 good:[
  {p:{X:[24,82],Y:[44,77],'5':[26,85],'4':[43,81]},arrows:[[38,74,24,82,'run'],[27,73,44,77,'run']],txt:L('Rakipler çapraz koşuyor. Her savunmacı kendi adamını bırakmadan, kale tarafında takip ediyor.','Die Gegner kreuzen. Jeder Verteidiger bleibt torseitig an seinem Mann.','They cross their runs. Each defender stays goal-side of his own man.','Ils croisent leurs courses. Chaque défenseur reste côté but de son joueur.')},
  {p:{M:[34,59]},txt:L('İki pas yolu da kapalı. Topçunun ileri pas seçeneği kalmıyor.','Beide Passwege sind zu. Der Ballführende hat keinen Pass nach vorn.','Both passing lanes are shut. The man on the ball has no forward pass.','Les deux lignes de passe sont fermées. Le porteur n’a pas de passe vers l’avant.')},
  {txt:L('Değişim yapılacaksa yüksek sesle söyle: “Sende!” Adam adama savunmada konuşmak şart.','Wird übergeben, laut sagen: „Deiner!“ Ohne Kommunikation geht Manndeckung nicht.','If you switch men, say it loud: “Yours!” Man-marking needs talking.','Si vous échangez, dis-le fort : « À toi ! » Sans parler, pas d’individuelle.')}],
 bad:[
  {p:{X:[24,82],Y:[44,77],'5':[26,85],'4':[30,83]},arrows:[[38,74,24,82,'run'],[27,73,44,77,'run']],zone:[44,77,5,'bad'],txt:L('Hata: iki stoper de aynı oyuncuya kayıyor. Diğer rakip boşta kalıyor.','Fehler: Beide IV gehen zum selben Spieler. Der andere bleibt frei.','Mistake: both centre-backs drift to the same man. The other one is free.','Erreur : les deux centraux suivent le même joueur. L’autre est libre.')},
  {p:{Y:[44,79]},ball:'Y',arrows:[[34,56,44,79,'pass']],txt:L('Pas boştaki oyuncuya gidiyor.','Der Pass geht zum freien Spieler.','The pass goes to the free man.','La passe va au joueur libre.')},
  {p:{Y:[40,90]},arrows:[[44,79,40,90,'run']],txt:L('Kaleciyle karşı karşıya.','Allein vor dem Torwart.','One-on-one with the keeper.','Seul face au gardien.')}]},

{id:'doldurma',phase:'def',lvl:2,tags:['CB','FB','DM'],view:'def',

 actors:[['3','us',14,78],['4','us',28,80],['5','us',40,80],['2','us',54,78],['6','us',30,68],['X','op',38,72],['Z','op',50,63],['M','op',30,52]],ball:'M',
 intro:{txt:L('Rakip forvet top almak için aşağı geliyor.','Der gegnerische Stürmer kommt entgegen, um den Ball zu holen.','Their striker drops short to get the ball.','L’attaquant adverse décroche pour recevoir.')},

  {p:{Z:[44,78],'2':[45,80]},arrows:[[50,63,44,78,'run']],txt:L('Boşluğa koşan rakip, kayan bek tarafından karşılanıyor.','Der Läufer in die Lücke wird vom eingeschobenen AV aufgenommen.','The runner into the gap meets the full-back who slid across.','Le coureur dans le trou trouve le latéral qui a glissé.')},
  {p:{X:[36,62],'5':[40,79],'4':[29,80],'2':[52,78],'3':[15,78],Z:[50,70]},ball:'M',arrows:[[38,66,30,52,'pass']],txt:L('Baskı bitince stoper hemen hatta geri döner, herkes yerine kayar.','Nach dem Pressing kehrt der IV sofort in die Kette zurück, alle schieben zurück.','Once the press ends, the centre-back drops straight back and everyone resets.','Une fois le pressing fini, le central revient et chacun reprend sa place.')}],
 bad:[
  {p:{X:[38,66],'5':[38,70]},ball:'X',arrows:[[30,52,38,66,'pass'],[40,80,38,70,'press']],zone:[42,79,5,'bad'],txt:L('Hata: stoper baskıya çıktı ama kimse yerini doldurmadı.','Fehler: Der IV ist herausgerückt, aber niemand schließt seinen Raum.','Mistake: the centre-back stepped out, but nobody filled his space.','Erreur : le central est sorti, mais personne ne comble.')},
  {p:{Z:[42,82]},arrows:[[50,63,42,82,'run']],txt:L('Rakip, stoperin bıraktığı boşluğa koşuyor.','Der Gegner läuft in den Raum, den der IV verlassen hat.','The opponent runs into the space the centre-back left.','L’adversaire attaque l’espace laissé par le central.')},
  {p:{Z:[40,91]},ball:'Z',arrows:[[38,66,42,82,'pass']],txt:L('Tek pasla kale önünde boş adam.','Ein Pass, und ein Gegner steht frei vor dem Tor.','One pass and a man is free in front of goal.','Une passe et un joueur est seul devant le but.')}]},

 bad:[
  {p:{'3':[14,84],'4':[28,74],'5':[40,74],'2':[54,74]},ball:'N',line:[84,'bad'],arrows:[[34,60,34,50,'pass']],zone:[14,84,4,'bad'],txt:L('Hata: bir savunmacı (3) geride kaldı. Tüm rakipleri oyunda tutuyor.','Fehler: Ein Verteidiger (3) bleibt hinten und hebt das Abseits für alle auf.','Mistake: one defender (3) stays deep and plays everyone onside.','Erreur : un défenseur (3) reste bas et met tout le monde en jeu.')},

 actors:[['3','us',14,76],['4','us',28,82],['W','op',12,62]],ball:'W',
 intro:{txt:L('Rakip kanat topla beke doğru geliyor.','Der gegnerische Flügelspieler dribbelt auf den AV zu.','Their winger runs at the full-back with the ball.','L’ailier adverse arrive balle au pied sur le latéral.')},
 good:[
  {p:{W:[12,67],'3':[16,72]},arrows:[[16,72,8,80,'guide']],txt:L('Bek iç tarafta duruyor, gövdesini çapraz açıyor ve rakibi çizgiye yönlendiriyor.','Der AV steht innen, öffnet den Körper seitlich und lenkt nach außen.','The full-back stands inside, opens his body and shows him down the line.','Le latéral se place à l’intérieur, ouvre son corps et oriente vers la ligne.')},
  {p:{W:[5,80],'3':[9,81]},arrows:[[12,67,5,80,'run']],txt:L('Rakip dışarı gitmek zorunda. Kaleyle açısı daralıyor.','Der Gegner muss nach außen. Sein Winkel zum Tor wird kleiner.','He has to go outside. His angle to goal gets smaller.','Il doit partir dehors. Son angle vers le but se réduit.')},
  {p:{W:[3,88],'3':[6,88]},ball:[-1,92],txt:L('Ya top dışarı çıkıyor ya da zor bir açıdan orta yapmak zorunda.','Der Ball geht ins Aus oder er muss aus schlechtem Winkel flanken.','Either the ball goes out or he has to cross from a poor angle.','Soit le ballon sort, soit il centre dans un angle difficile.')}],

  {p:{W:[22,78],'3':[13,76]},arrows:[[12,67,22,78,'run']],txt:L('Rakip içeri kat ediyor ve kaleye dönük tehlikeli bölgeye giriyor.','Der Gegner zieht nach innen in die gefährliche Zone vor dem Tor.','He cuts inside, into the dangerous area facing goal.','Il repique vers l’intérieur, dans la zone dangereuse face au but.')},
  {ball:[32,104],arrows:[[22,78,32,104,'pass']],txt:L('Rahat şut çekebiliyor.','Er kann frei schießen.','He gets a free shot.','Il peut frapper librement.')}]},

 sum:L('Kaleci topla; stoperler genişler, 6 gölgeden çıkar, hattı kıran pas aranır.','Torwart am Ball: IV gehen breit, der Sechser löst sich, Pass durch die Linie.','Keeper on the ball: CBs split, the 6 gets free, look for the line-breaking pass.','Gardien au ballon : les centraux s’écartent, le 6 se libère, passe qui casse la ligne.'),
 actors:[['1','us',34,101],['4','us',28,95],['5','us',40,95],['6','us',34,80],['8','us',42,70],['X','op',34,84],['P','op',36,74],['Q','op',50,78]],ball:'1',
 intro:{txt:L('Top kalecide. Rakip forvet (X) ortada bekliyor.','Der Torwart hat den Ball. Der gegnerische Stürmer wartet zentral.','The keeper has the ball. Their striker waits centrally.','Le gardien a le ballon. L’attaquant adverse attend dans l’axe.')},
 good:[
  {p:{'4':[14,93],'5':[54,93],'6':[42,84]},arrows:[[28,95,14,93,'run'],[40,95,54,93,'run']],txt:L('Stoperler ceza sahasının kenarına açılıyor. 6 numara forvetin gölgesinden çıkıyor.','Die IV gehen an die Strafraumkante. Der Sechser löst sich aus dem Deckungsschatten.','The centre-backs split to the edges of the box. The 6 steps out of the striker’s shadow.','Les centraux s’écartent au bord de la surface. Le 6 sort de l’ombre de l’attaquant.')},
  {p:{X:[44,90]},ball:'5',arrows:[[34,101,54,93,'pass']],txt:L('Kaleci açılan stopere veriyor. Forvet tek başına iki seçeneği birden kapatamaz.','Pass zum breiten IV. Ein Stürmer allein kann nicht beide Optionen schließen.','The keeper finds the wide centre-back. One striker cannot close both options.','Le gardien trouve le central écarté. Un attaquant seul ne peut pas tout fermer.')},
  {p:{'5':[55,81],Q:[54,74]},arrows:[[54,93,55,81,'run']],txt:L('Önü boş olduğu için stoper topu sürerek ileri taşıyor. Bu, bir rakibi üzerine çekiyor.','Vor ihm ist Platz, also dribbelt der IV an. Das zieht einen Gegner heraus.','With space ahead, the centre-back carries the ball. That draws an opponent out.','Avec de l’espace devant lui, le central conduit. Cela attire un adversaire.')},
  {p:{'8':[44,64]},ball:'8',arrows:[[55,81,44,64,'pass']],txt:L('Rakip stopere çıkınca hatlar arasındaki 8 numara boşalıyor. Hattı kıran pas tam bu an.','Rückt der Gegner heraus, wird der Achter zwischen den Linien frei. Jetzt kommt der linienbrechende Pass.','When the opponent steps up, the 8 between the lines is free. Now the line-breaking pass.','Quand l’adversaire sort, le 8 entre les lignes est libre. C’est le moment de casser la ligne.')}],
 bad:[
  {p:{'6':[34,88]},zone:[34,86,4,'bad'],txt:L('Hata: stoperler dar, 6 numara forvetin hemen arkasında saklanıyor. Kısa pas yok.','Fehler: Die IV stehen eng, der Sechser versteckt sich hinter dem Stürmer. Kein kurzer Pass.','Mistake: the centre-backs stay narrow and the 6 hides right behind the striker. No short pass.','Erreur : centraux serrés, le 6 caché derrière l’attaquant. Pas de passe courte.')},
  {p:{X:[34,96]},arrows:[[34,84,34,96,'press']],txt:L('Forvet kaleciye baskı yapıyor. Kısa pas çok riskli.','Der Stürmer läuft den Torwart an. Ein kurzer Pass ist zu riskant.','The striker presses the keeper. A short pass is too risky.','L’attaquant presse le gardien. La passe courte est trop risquée.')},
  {ball:[34,50],arrows:[[34,101,34,52,'pass']],txt:L('Kaleci uzun vurmak zorunda. Top büyük ihtimalle rakibe geçiyor.','Der Torwart muss lang schlagen. Der Ball geht meist verloren.','The keeper has to go long. The ball is probably lost.','Le gardien doit jouer long. Le ballon est sans doute perdu.')}]},

{id:'bindirme',phase:'att',lvl:1,tags:['FB','W'],view:'att',

 sum:L('Kanat içeri sürerken bek dışarıdan bindirir; rakip bek ikisini birden alamaz.','Der Flügel zieht nach innen, der AV hinterläuft außen; der Gegner kann nicht beide nehmen.','Winger drives inside, full-back overlaps outside; their full-back can’t take both.','L’ailier rentre, le latéral déborde ; l’adversaire ne peut pas prendre les deux.'),
 actors:[['7','us',58,40],['2','us',58,52],['9','us',34,22],['A','op',58,30],['B','op',50,44],['C','op',40,16]],ball:'7',
 intro:{txt:L('Kanat (7) topla, karşısında rakip bek (A).','Flügelspieler (7) am Ball, vor ihm der gegnerische AV.','Winger (7) on the ball, their full-back in front of him.','L’ailier (7) a le ballon, face à leur latéral.')},
 good:[
  {p:{'7':[50,33],A:[54,28],'2':[64,36]},arrows:[[58,40,50,33,'run'],[58,52,64,36,'run']],txt:L('7 numara içeri sürüyor. Bek (2) arkasından dışarıdan bindiriyor.','Die 7 dribbelt nach innen. Der AV (2) hinterläuft außen.','The 7 drives inside. The full-back (2) overlaps on the outside.','Le 7 rentre balle au pied. Le latéral (2) déborde par l’extérieur.')},
  {p:{'2':[64,22]},ball:'2',arrows:[[50,33,64,22,'pass']],txt:L('Rakip bek iki oyuncunun arasında kalıyor. Pas boştaki beke.','Der gegnerische AV steht zwischen zwei Spielern. Pass zum freien AV.','Their full-back is caught between two. Pass to the free full-back.','Leur latéral est pris entre deux. Passe au latéral libre.')},
  {p:{'9':[36,9],C:[42,10]},ball:[36,8],arrows:[[64,22,36,9,'pass'],[34,22,36,9,'run']],txt:L('2 numara çizgiye inip ortalıyor. 9 numara ön direğe koşuyor.','Die 2 geht zur Grundlinie und flankt. Die 9 läuft zum ersten Pfosten.','The 2 reaches the byline and crosses. The 9 attacks the near post.','Le 2 va au bout et centre. Le 9 attaque le premier poteau.')}],
 bad:[
  {p:{'7':[50,33],A:[54,28]},arrows:[[58,40,50,33,'run']],zone:[62,40,5,'bad'],txt:L('Hata: bek geride kalıyor. Dış koridor boş ama kullanılmıyor.','Fehler: Der AV bleibt hinten. Der Außenkorridor ist frei, aber ungenutzt.','Mistake: the full-back stays back. The outside lane is empty and unused.','Erreur : le latéral reste derrière. Le couloir est libre mais inutilisé.')},
  {p:{A:[51,30],B:[48,36]},arrows:[[50,44,48,36,'press']],txt:L('Kanat iki rakibin arasında yalnız kalıyor.','Der Flügel ist allein gegen zwei Gegner.','The winger is alone against two.','L’ailier est seul contre deux.')},
  {ball:'A',txt:L('Top kaybı; rakip kontra atağa çıkıyor.','Ballverlust, der Gegner kontert.','Ball lost, they counter.','Ballon perdu, ils contre-attaquent.')}]},

{id:'icten-kosu',phase:'att',lvl:3,tags:['FB','W'],view:'att',
 title:L('Bekin içten koşusu (yarı alan)','Der AV läuft innen (Halbraum)','The full-back’s underlap (half-space)','Le latéral par l’intérieur (demi-espace)'),
 sum:L('Kanat genişliği tutar, bek rakip bekle stoper arasındaki boşluğa içten koşar.','Der Flügel hält die Breite, der AV startet innen zwischen AV und IV.','Winger holds width, full-back runs inside between their full-back and centre-back.','L’ailier garde la largeur, le latéral attaque entre le latéral et le central.'),
 actors:[['8','us',42,44],['2','us',56,52],['7','us',62,32],['9','us',36,20],['A','op',58,30],['B','op',48,40],['C','op',44,16]],ball:'8',
 intro:{txt:L('Top 8 numarada. Kanat (7) çizgide, rakip bek (A) onunla.','Der Ball ist bei der 8. Der Flügel (7) steht an der Linie, der gegnerische AV bei ihm.','The 8 has the ball. The winger (7) is on the touchline with their full-back.','Le 8 a le ballon. L’ailier (7) est collé à la ligne avec leur latéral.')},
 good:[
  {p:{'7':[65,28],A:[61,29],'2':[50,24]},arrows:[[56,52,50,24,'run']],zone:[51,25,4,'good'],txt:L('7 numara çizgide kalıp rakip beki genişte tutuyor. Bek (2) içten, yarı alana koşuyor.','Die 7 bleibt breit und bindet den AV. Der eigene AV (2) läuft innen in den Halbraum.','The 7 stays wide and pins their full-back. Our full-back (2) runs inside into the half-space.','Le 7 reste large et fixe le latéral. Notre latéral (2) attaque le demi-espace.')},
  {ball:'2',arrows:[[42,44,50,24,'pass']],txt:L('Rakip bek kanatla meşgul. İçteki koşu boş kalıyor, pas oraya.','Der AV ist mit dem Flügel beschäftigt. Der Lauf innen bleibt frei, der Pass kommt.','Their full-back is busy with the winger. The inside run is free and gets the ball.','Leur latéral est occupé par l’ailier. La course intérieure est libre et reçoit.')},
  {p:{'9':[36,13]},ball:'9',arrows:[[50,24,36,13,'pass']],txt:L('Yarı alandan geri pas: 9 numaraya net şut fırsatı.','Rückpass aus dem Halbraum: klare Chance für die 9.','A cut-back from the half-space: a clear chance for the 9.','Passe en retrait depuis le demi-espace : occasion nette pour le 9.')}],
 bad:[
  {p:{'2':[64,36]},arrows:[[56,52,64,36,'run']],txt:L('Hata: bek de dışarıdan koşuyor. İkisi aynı koridorda.','Fehler: Der AV läuft auch außen. Beide stehen im selben Korridor.','Mistake: the full-back also runs outside. Both are in the same lane.','Erreur : le latéral part aussi à l’extérieur. Les deux dans le même couloir.')},
  {p:{A:[62,32],B:[54,32]},zone:[50,24,4,'bad'],txt:L('Tek rakip ikisini birden kapatıyor. Yarı alan boş ama kimse orada değil.','Ein Gegner deckt beide. Der Halbraum ist leer, aber niemand ist dort.','One opponent covers both. The half-space is empty but nobody is there.','Un seul adversaire couvre les deux. Le demi-espace est vide, personne n’y va.')},
  {ball:[40,56],arrows:[[42,44,40,56,'pass']],txt:L('İleri pas yolu yok; top geriye dönüyor.','Kein Pass nach vorn, der Ball geht zurück.','No forward pass; the ball goes backwards.','Pas de passe vers l’avant ; le ballon revient.')}]},

{id:'uzak-kanat',phase:'att',lvl:2,tags:['W','FB'],view:'mid',

 good:[

  {ball:'A',txt:L('Top dar alanda kaybediliyor.','Ballverlust auf engem Raum.','The ball is lost in the tight space.','Ballon perdu dans l’espace réduit.')}]},

{id:'pas-acisi',phase:'att',lvl:1,tags:['CM','DM','AM'],view:'mid',
 title:L('Top bizdeyken pas açısı yarat','Mit Ball: Passwinkel schaffen','In possession: create a passing angle','Avec le ballon : créer un angle de passe'),
 sum:L('Rakibin arkasında saklanma; gölgeden çık, üçgen kur, açık vücutla al.','Nicht hinter dem Gegner verstecken: aus dem Schatten, Dreieck, offene Stellung.','Don’t hide behind an opponent: step out of the shadow, form a triangle, open body.','Ne te cache pas derrière un adversaire : sors de l’ombre, triangle, corps ouvert.'),
 actors:[['5','us',44,70],['6','us',34,60],['8','us',44,50],['9','us',36,30],['X','op',38,63],['O','op',44,58]],ball:'5',
 intro:{txt:L('Top stoperde. 8 numara rakibin (O) tam arkasında, pas çizgisi kapalı.','Der Ball ist beim IV. Die 8 steht direkt hinter dem Gegner, der Passweg ist zu.','The centre-back has the ball. The 8 is right behind an opponent, the lane is shut.','Le central a le ballon. Le 8 est juste derrière un adversaire, la ligne est fermée.')},
 good:[
  {p:{'8':[53,53],'6':[29,59]},arrows:[[44,50,53,53,'run']],zone:[53,53,4,'good'],txt:L('8 numara yana kayarak gölgeden çıkıyor. Stoper, 6 ve 8 bir üçgen oluşturuyor.','Die 8 löst sich seitlich aus dem Schatten. IV, 6 und 8 bilden ein Dreieck.','The 8 slides out of the shadow. Centre-back, 6 and 8 form a triangle.','Le 8 glisse pour sortir de l’ombre. Central, 6 et 8 forment un triangle.')},
  {ball:'8',arrows:[[44,70,53,53,'pass']],txt:L('Pas çizgisi temiz. 8 numara topu açık vücutla, ileriye dönük alıyor.','Der Passweg ist frei. Die 8 nimmt den Ball offen, mit Blick nach vorn an.','The lane is clear. The 8 receives with an open body, facing forward.','La ligne est libre. Le 8 reçoit corps ouvert, orienté vers l’avant.')},
  {ball:'9',arrows:[[53,53,36,30,'pass']],txt:L('Dönmek zorunda kalmadığı için hemen ileri oynayabiliyor.','Weil er sich nicht drehen muss, spielt er sofort nach vorn.','Because he doesn’t have to turn, he plays forward at once.','Comme il n’a pas à se retourner, il joue vers l’avant aussitôt.')}],
 bad:[
  {zone:[44,54,5,'bad'],txt:L('Hata: 8 numara yerinde kalıyor. Stoperden bakınca rakibin arkasında görünmüyor.','Fehler: Die 8 bleibt stehen. Vom IV aus ist sie hinter dem Gegner unsichtbar.','Mistake: the 8 stays put. From the centre-back he is hidden behind the opponent.','Erreur : le 8 reste là. Depuis le central, il est caché derrière l’adversaire.')},
  {p:{X:[43,66]},arrows:[[38,63,43,66,'press']],txt:L('İki seçenek de kapalı ve forvet stopere baskı yapıyor.','Beide Optionen sind zu und der Stürmer läuft den IV an.','Both options are shut and the striker presses the centre-back.','Les deux options sont fermées et l’attaquant presse le central.')},
  {ball:[34,82],arrows:[[44,70,34,82,'pass']],txt:L('Top geriye dönüyor; oyun ileri gidemiyor.','Der Ball geht zurück, das Spiel kommt nicht nach vorn.','The ball goes back; play can’t progress.','Le ballon revient ; le jeu n’avance pas.')}]},

{id:'ucuncu-adam',phase:'att',lvl:3,tags:['CM','ST'],view:'mid',

  {ball:'9',p:{'8':[44,44]},arrows:[[40,72,36,52,'pass'],[46,54,44,44,'run']],txt:L('Stoper 9’a veriyor. Aynı anda 8 numara boşalan alana koşuya başlıyor.','Der IV spielt die 9 an. Gleichzeitig startet die 8 in den freien Raum.','The centre-back finds the 9. At the same moment the 8 starts into the free space.','Le central trouve le 9. Au même moment, le 8 attaque l’espace libéré.')},
  {p:{'8':[40,30]},ball:'8',arrows:[[36,52,40,30,'pass']],txt:L('9 tek dokunuşla koşan 8’e veriyor. Savunmanın arkası açık.','Die 9 legt direkt auf die startende 8 ab. Der Raum hinter der Abwehr ist offen.','The 9 lays it off first time to the running 8. Space opens behind the defence.','Le 9 remet en une touche au 8 lancé. L’espace s’ouvre dans le dos.')}],
 bad:[

  {ball:'9',p:{C:[36,50]},arrows:[[40,72,36,52,'pass']],txt:L('Hata: 8 numara durduğu yerde. 9 sırtı dönük ve baskı altında.','Fehler: Die 8 bleibt stehen. Die 9 steht mit dem Rücken zum Tor unter Druck.','Mistake: the 8 stands still. The 9 has his back to goal under pressure.','Erreur : le 8 reste immobile. Le 9 est dos au but sous pression.')},
  {ball:'C',txt:L('Tek seçenek geri pas ya da top kaybı.','Nur Rückpass oder Ballverlust.','Only a back pass or losing the ball.','Seule option : passe en retrait ou perte du ballon.')}]},

{id:'derinlik',phase:'att',lvl:2,tags:['ST','W'],view:'att',
 title:L('Derinlik koşusu: ne zaman koşmalı?','Lauf in die Tiefe: wann starten?','Running in behind: when to go?','Appel en profondeur : quand partir ?'),

 actors:[['8','us',40,48],['9','us',34,27],['C','op',30,24],['D','op',42,24],['O','op',44,40]],ball:'8',

  {ball:[34,0],txt:L('Kaleciyle karşı karşıya.','Allein vor dem Torwart.','One-on-one with the keeper.','Seul face au gardien.')}],
 bad:[

  {p:{'9':[38,8]},ball:'9',line:[24,'bad'],arrows:[[40,48,38,8,'pass']],txt:L('Pas geldiğinde ofsayt. Atak bitiyor.','Beim Pass Abseits. Der Angriff ist vorbei.','Offside when the pass comes. The attack is over.','Hors-jeu au moment de la passe. L’attaque est finie.')}]},

 sum:L('İlk 5 saniye: en yakın oyuncu baskı yapar, diğerleri pas yollarını kapatır.','Die ersten 5 Sekunden: der Nächste presst, die anderen schließen Passwege.','First 5 seconds: the nearest player presses, the others close passing lanes.','5 premières secondes : le plus proche presse, les autres ferment les lignes.'),
 actors:[['8','us',40,40],['10','us',30,36],['7','us',54,38],['6','us',36,56],['O','op',40,43],['P','op',24,50],['Q','op',52,54]],ball:'O',
 intro:{txt:L('Takım arkadaşımız (8) topu kaptırdı. İlk 5 saniye kritik.','Unser Spieler (8) hat den Ball verloren. Die ersten 5 Sekunden zählen.','Our 8 has lost the ball. The first 5 seconds are critical.','Notre 8 a perdu le ballon. Les 5 premières secondes sont décisives.')},
 good:[
  {p:{'8':[40,46],'10':[30,47],'7':[49,50],'6':[39,52]},arrows:[[40,40,40,46,'press'],[30,36,30,47,'run'],[54,38,49,50,'run']],txt:L('En yakın oyuncu (8) hemen baskı yapıyor. 10 ve 7 iki pas yolunu kesiyor, 6 öne çıkıyor.','Der Nächste (8) presst sofort. 10 und 7 schneiden beide Passwege ab, die 6 rückt vor.','The nearest player (8) presses at once. The 10 and 7 cut both lanes, the 6 steps in.','Le plus proche (8) presse aussitôt. Le 10 et le 7 coupent les lignes, le 6 avance.')},
  {ball:'6',p:{O:[42,49]},txt:L('Rakip sıkıştı ve top geri kazanıldı.','Der Gegner ist eingeklemmt, der Ball ist zurückerobert.','The opponent is trapped and the ball is won back.','L’adversaire est piégé, le ballon est récupéré.')},
  {ball:'10',arrows:[[39,52,30,47,'pass']],p:{'10':[28,40]},txt:L('Rakip yerleşmeden hemen ileri: savunmaları hâlâ açık.','Sofort nach vorn, bevor sich der Gegner ordnet.','Straight forward, before they can reorganise.','Vers l’avant tout de suite, avant qu’ils ne se replacent.')}],
 bad:[
  {p:{'10':[30,42],'7':[55,45]},txt:L('Hata: top kaybına tepki yok. Oyuncular duruyor ya da yavaşça geri yürüyor.','Fehler: Keine Reaktion. Die Spieler bleiben stehen oder traben zurück.','Mistake: no reaction. Players stop or jog back slowly.','Erreur : aucune réaction. Les joueurs s’arrêtent ou reviennent en trottinant.')},
  {p:{Q:[54,60]},ball:'Q',arrows:[[40,43,54,60,'pass']],txt:L('Rakip rahatça ilk pası atıyor.','Der Gegner spielt ungestört den ersten Pass.','They play the first pass without pressure.','Ils jouent la première passe sans pression.')},
  {p:{Q:[56,76]},arrows:[[54,60,56,76,'run']],txt:L('Kontra atak: savunmamız dengesiz yakalanıyor.','Konter: unsere Abwehr ist nicht geordnet.','Counter-attack: our defence is caught unbalanced.','Contre-attaque : notre défense est prise déséquilibrée.')}]},

{id:'hizli-hucum',phase:'trans',lvl:2,tags:['W','ST','DM'],view:'full',
 title:L('Top kazanınca hızlı hücum','Schnell umschalten nach Ballgewinn','Fast break after winning the ball','Transition rapide après récupération'),
 sum:L('Kanatlar hemen koşar, ilk pas ileri gider; rakip yerleşmeden bitir.','Flügel starten sofort, erster Pass nach vorn, abschließen bevor der Gegner steht.','Wingers sprint at once, the first pass goes forward, finish before they set.','Les ailiers partent, première passe vers l’avant, finir avant qu’ils se replacent.'),
 actors:[['6','us',34,62],['5','us',44,74],['7','us',58,56],['11','us',10,56],['9','us',34,46],['A','op',20,40],['B','op',34,36],['C','op',48,40],['D','op',26,70],['E','op',42,70]],ball:'6',
 intro:{txt:L('6 numara topu kazandı. Rakibin birçok oyuncusu hâlâ bizim yarı sahada.','Die 6 hat den Ball gewonnen. Viele Gegner sind noch in unserer Hälfte.','The 6 has won the ball. Many opponents are still in our half.','Le 6 a récupéré le ballon. Beaucoup d’adversaires sont encore dans notre moitié.')},
 good:[
  {p:{'7':[60,40],'11':[8,40],'9':[36,40]},arrows:[[58,56,60,40,'run'],[10,56,8,40,'run']],txt:L('Kanatlar hemen genişte ileri koşuyor. Hücum alanı büyüyor.','Die Flügel sprinten sofort breit nach vorn. Das Feld wird groß.','The wingers sprint forward wide at once. The pitch gets big.','Les ailiers partent large immédiatement. Le terrain s’agrandit.')},
  {ball:'9',arrows:[[34,62,36,41,'pass']],txt:L('İlk pas ileri: rakip yerleşmeden hatları geç.','Der erste Pass geht nach vorn: Linien überspielen, bevor der Gegner steht.','The first pass goes forward: beat the lines before they set.','La première passe va vers l’avant : dépasser les lignes avant qu’ils se placent.')},
  {p:{'7':[62,22],A:[22,30],B:[34,28],C:[46,28],D:[26,60],E:[42,60]},ball:'7',arrows:[[36,40,62,22,'pass']],txt:L('9 numara koşan kanada açıyor. Rakip geriye koşarken savunmak zorunda.','Die 9 spielt auf den startenden Flügel. Der Gegner muss rückwärts verteidigen.','The 9 releases the running winger. They have to defend running backwards.','Le 9 lance l’ailier. Ils doivent défendre en courant vers leur but.')}],
 bad:[
  {txt:L('Hata: kanatlar koşmuyor, herkes yerinde.','Fehler: Die Flügel starten nicht, alle bleiben stehen.','Mistake: the wingers don’t run; everyone stays put.','Erreur : les ailiers ne partent pas ; personne ne bouge.')},
  {ball:'5',arrows:[[34,62,44,74,'pass']],txt:L('İlk pas geriye. Rakip zaman kazanıyor.','Der erste Pass geht zurück. Der Gegner gewinnt Zeit.','The first pass goes backwards. They gain time.','La première passe part en arrière. Ils gagnent du temps.')},
  {p:{D:[26,46],E:[42,46]},arrows:[[26,70,26,46,'run'],[42,70,42,46,'run']],txt:L('Rakip geri dönüp yerleşiyor. Hızlı hücum fırsatı kaçtı.','Der Gegner ist zurück und geordnet. Die Chance ist weg.','They get back into shape. The chance has gone.','Ils sont revenus et organisés. L’occasion est passée.')}]},

{id:'korner',phase:'set',lvl:2,tags:['CB','DM','GK'],view:'def',
 title:L('Korner savunması: karışık sistem','Eckball verteidigen: gemischtes System','Defending corners: mixed system','Défendre un corner : système mixte'),
 sum:L('Üç oyuncu altıpas çizgisinde alanı tutar, iki oyuncu tehlikeli rakipleri adam adama alır.','Drei verteidigen den Raum am Fünfer, zwei decken die gefährlichsten Gegner.','Three hold the zone on the six-yard line, two mark the most dangerous opponents.','Trois tiennent la zone des six mètres, deux marquent les plus dangereux.'),
 actors:[['1','us',35,104],['2','us',31,103],['4','us',28,99],['5','us',34,99],['3','us',40,99],['6','us',31,93],['8','us',41,93],['K','op',68,105],['H1','op',30,90],['H2','op',41,90],['H3','op',48,94]],ball:'K',
 intro:{txt:L('Korner sağdan. Üç oyuncu (4, 5, 3) alanda, iki oyuncu (6, 8) adam adama, bir oyuncu (2) ön direkte.','Ecke von rechts. Drei (4, 5, 3) im Raum, zwei (6, 8) in Manndeckung, einer (2) am ersten Pfosten.','Corner from the right. Three (4, 5, 3) in the zone, two (6, 8) man-marking, one (2) at the near post.','Corner à droite. Trois (4, 5, 3) en zone, deux (6, 8) en individuelle, un (2) au premier poteau.')},
 good:[
  {p:{H1:[32,97],'6':[32,96],H2:[40,96],'8':[40,97],H3:[44,100]},arrows:[[30,90,32,97,'run'],[41,90,40,96,'run'],[48,94,44,100,'run']],txt:L('Rakipler koşuya başlıyor. İşaretçiler adamını bırakmıyor, alan oyuncuları yerinde kalıyor.','Die Gegner starten. Die Manndecker bleiben dran, die Raumspieler bleiben stehen.','They start their runs. The markers stay tight, the zonal players hold.','Ils lancent leurs courses. Les marqueurs restent collés, les joueurs de zone tiennent.')},
  {p:{'5':[35,97]},ball:'5',arrows:[[68,105,35,97,'pass']],txt:L('Top alana gelince alan oyuncusu (5) öne çıkıp topa ilk dokunan oluyor.','Kommt der Ball in den Raum, attackiert der Raumspieler (5) ihn als Erster.','When the ball enters the zone, the zonal player (5) attacks it first.','Quand le ballon arrive dans la zone, le joueur de zone (5) l’attaque le premier.')},
  {ball:[56,74],p:{'4':[28,92],'5':[35,92],'3':[40,92],'6':[32,90],'8':[40,90]},arrows:[[35,97,56,74,'pass']],txt:L('Uzaklaştırma yüksek ve kenara. Sonra hep birlikte dışarı çıkılır.','Klären hoch und nach außen. Danach rücken alle gemeinsam heraus.','Clear it high and wide. Then everyone steps out together.','Dégagement haut et sur le côté. Puis tout le monde remonte ensemble.')}],
 bad:[
  {p:{H1:[32,97],'6':[32,96],H2:[40,96],'8':[38,95],H3:[46,100],'3':[37,99]},arrows:[[48,94,46,100,'run']],zone:[46,100,4,'bad'],txt:L('Hata: herkes topa bakıyor. 3 numara topa doğru kaydı, arka direğe koşan rakip boş.','Fehler: Alle schauen zum Ball. Die 3 rückt zum Ball, der Läufer am zweiten Pfosten ist frei.','Mistake: everyone watches the ball. The 3 drifts towards it and the back-post runner is free.','Erreur : tout le monde regarde le ballon. Le 3 se décale et le coureur au second poteau est libre.')},
  {ball:'H3',arrows:[[68,105,46,100,'pass']],txt:L('Top arka direğe; rakip boşta kafa vuruyor.','Der Ball geht an den zweiten Pfosten, der Gegner köpft frei.','The ball goes to the back post; he heads it unmarked.','Le ballon arrive au second poteau ; il reprend seul de la tête.')},
  {ball:[37,105.5],txt:L('Gol. Alan savunmasında yerini korumak, adam adamada adamı bırakmamak şart.','Tor. In der Raumdeckung die Position halten, in der Manndeckung den Mann nicht verlieren.','Goal. Zonal players must hold their spot; markers must not lose their man.','But. En zone, garde ta place ; en individuelle, ne lâche pas ton joueur.')}]},
{id:'kaleci-aci',phase:'def',lvl:1,tags:['GK'],view:'def',
 title:L('Kaleci: açıyı kapat','Torwart: den Winkel verkürzen','Goalkeeper: narrow the angle','Gardien : fermer l’angle'),
 sum:L('Topla iki direk arasındaki açının ortasında dur, top yaklaştıkça öne çık.','In der Mitte des Winkels zwischen Ball und Pfosten stehen, bei Annäherung herauskommen.','Stand on the middle of the angle between ball and posts; step out as it gets closer.','Place-toi au milieu de l’angle entre ballon et poteaux ; avance quand il approche.'),
 actors:[['1','us',34,103],['5','us',44,88],['A','op',40,76]],ball:'A',
 intro:{txt:L('Top ortada. Kaleci çizginin biraz önünde, tam ortada.','Der Ball ist zentral. Der Torwart steht knapp vor der Linie in der Mitte.','The ball is central. The keeper is just off his line, in the middle.','Le ballon est dans l’axe. Le gardien est juste devant sa ligne, au centre.')},
 good:[
  {p:{A:[54,88],'1':[36.4,102.4]},arrows:[[54,88,30.3,105,'guide'],[54,88,37.7,105,'guide']],txt:L('Top kanada gidince kaleci ön direğe kayıyor ve açının ortasında duruyor.','Geht der Ball nach außen, verschiebt der Torwart zum ersten Pfosten in die Winkelmitte.','As the ball goes wide, the keeper shifts towards the near post, on the middle of the angle.','Quand le ballon s’écarte, le gardien glisse vers le premier poteau, au milieu de l’angle.')},
  {p:{A:[50,96],'1':[38,100]},arrows:[[54,88,50,96,'run']],txt:L('Rakip yaklaştıkça kaleci öne çıkıp açıyı daraltıyor; kale küçülüyor.','Kommt der Gegner näher, tritt der Torwart heraus und verkürzt den Winkel.','As he gets closer, the keeper steps out and narrows the angle; the goal shrinks.','Quand il se rapproche, le gardien sort et réduit l’angle ; le but rétrécit.')},
  {ball:'1',arrows:[[50,96,38,100,'pass']],txt:L('Şut kalecinin üzerine geliyor.','Der Schuss kommt auf den Torwart.','The shot comes straight at the keeper.','La frappe arrive sur le gardien.')}],
 bad:[
  {p:{A:[54,88]},zone:[36.8,104,2.2,'bad'],arrows:[[54,88,30.3,105,'guide'],[54,88,37.7,105,'guide']],txt:L('Hata: kaleci ortada ve çizgide kalıyor. Ön direk açık.','Fehler: Der Torwart bleibt mittig auf der Linie. Der erste Pfosten ist offen.','Mistake: the keeper stays central on his line. The near post is open.','Erreur : le gardien reste au centre sur sa ligne. Le premier poteau est ouvert.')},
  {ball:[37,105.6],arrows:[[54,88,37,105,'pass']],txt:L('Şut ön direkten gol oluyor.','Der Schuss geht am ersten Pfosten rein.','The shot goes in at the near post.','La frappe entre au premier poteau.')}]},

{id:'kaleci-supurucu',phase:'def',lvl:2,tags:['GK','CB'],view:'def',
 title:L('Süpürücü kaleci','Mitspielender Torwart (Libero)','The sweeper-keeper','Le gardien libéro'),
 sum:L('Hat yükseldikçe kaleci de öne çıkar ve savunma arkasındaki alanı kontrol eder.','Rückt die Kette vor, rückt auch der Torwart vor und sichert den Raum dahinter.','As the line steps up, the keeper steps up too and guards the space behind.','Quand la ligne monte, le gardien monte aussi et couvre l’espace dans le dos.'),
 actors:[['1','us',34,103],['4','us',28,78],['5','us',40,78],['X','op',36,74],['M','op',34,54]],ball:'M',
 intro:{txt:L('Savunma hattı yüksekte, ceza sahasının çok önünde.','Die Abwehrkette steht hoch, weit vor dem Strafraum.','The back line is high, well in front of the box.','La ligne défensive est haute, loin devant la surface.')},
 good:[
  {p:{'1':[34,90]},arrows:[[34,103,34,90,'run']],txt:L('Kaleci de ceza sahası kenarına çıkıyor. Savunma ile arasındaki mesafe kısalıyor.','Der Torwart rückt bis zur Strafraumkante vor. Der Abstand zur Kette wird klein.','The keeper moves up to the edge of the box. The gap to his defence closes.','Le gardien monte au bord de la surface. L’écart avec sa défense se réduit.')},
  {p:{X:[36,85],'1':[36,88.5]},ball:'1',arrows:[[34,54,36,88,'pass'],[36,74,36,85,'run']],txt:L('Savunma arkasına top atılınca kaleci forvetten önce topa ulaşıyor.','Kommt der Ball hinter die Kette, ist der Torwart vor dem Stürmer da.','When the ball goes in behind, the keeper gets there before the striker.','Quand le ballon passe dans le dos, le gardien arrive avant l’attaquant.')},
  {ball:[60,70],arrows:[[36,88.5,60,70,'pass']],txt:L('Uzaklaştırıyor ya da kontrol edip oyunu başlatıyor.','Er klärt oder nimmt an und baut auf.','He clears it or controls and restarts play.','Il dégage ou contrôle et relance.')}],
 bad:[
  {zone:[36,90,6,'bad'],txt:L('Hata: hat yüksekte ama kaleci çizgide. Arada büyük bir boşluk var.','Fehler: Die Kette steht hoch, der Torwart auf der Linie. Dazwischen ist ein großer Raum.','Mistake: the line is high, the keeper on his line. There is a huge gap between.','Erreur : ligne haute, gardien sur sa ligne. Un énorme espace entre les deux.')},
  {p:{X:[36,90]},ball:'X',arrows:[[34,54,36,90,'pass'],[36,74,36,90,'run']],txt:L('Top bu boşluğa atılınca forvet önce ulaşıyor.','Der Ball kommt in diesen Raum, der Stürmer ist zuerst dran.','The ball is played into that space and the striker gets there first.','Le ballon arrive dans cet espace, l’attaquant est le premier.')},
  {p:{X:[36,97]},ball:[34,105.6],txt:L('Kaleciyle karşı karşıya kalıp gol atıyor.','Allein vor dem Torwart, Tor.','One-on-one with the keeper, and he scores.','Seul face au gardien, il marque.')}]},

{id:'kaleci-baslatma',phase:'trans',lvl:2,tags:['GK','FB'],view:'full',

 good:[

  {ball:'2',arrows:[[34,100,62,74,'pass']],txt:L('Kaleci beklemeden atışla veriyor. Rakip üç oyuncusunu geride bırakmış oldu.','Der Torwart wirft sofort ab. Drei Gegner sind jetzt aus dem Spiel.','The keeper throws it at once. Three opponents are now out of the game.','Le gardien relance tout de suite. Trois adversaires sont hors du jeu.')},
  {p:{'7':[62,46]},ball:'7',arrows:[[62,74,62,46,'pass'],[58,62,62,46,'run']],txt:L('İki pasla orta saha geçildi; hızlı hücum başlıyor.','Zwei Pässe, das Mittelfeld ist überspielt. Der Konter läuft.','Two passes and midfield is bypassed. The fast break is on.','Deux passes et le milieu est dépassé. La contre-attaque est lancée.')}],

  {ball:'A',arrows:[[34,100,40,42,'pass']],txt:L('Sonunda uzun vuruş; havada top rakibe geçiyor.','Am Ende ein langer Ball, das Kopfballduell geht verloren.','In the end a long kick, and the header is lost.','Finalement un long dégagement, et le duel aérien est perdu.')}]},

{id:'hatlar-arasi',phase:'att',lvl:2,tags:['AM','CM'],view:'mid',

  {p:{M2:[35,57]},zone:[41,42,5,'bad'],arrows:[[35,50,35,57,'press']],txt:L('Hatlar arasındaki cep boş kaldı. Rakip orta saha rahatça baskı yapıyor.','Die Tasche bleibt leer. Das gegnerische Mittelfeld presst ungestört.','The pocket stays empty. Their midfield presses freely.','La poche reste vide. Leur milieu presse tranquillement.')},

{id:'golge-pres',phase:'def',lvl:2,tags:['AM','ST','W'],view:'mid',

 intro:{txt:L('Top rakip stoperde (A). Onların 6 numarası (S) ortada top bekliyor.','Der gegnerische IV hat den Ball. Ihr Sechser wartet zentral.','Their centre-back has the ball. Their 6 waits in the middle.','Leur central a le ballon. Leur 6 attend dans l’axe.')},

  {p:{'9':[40,32],'10':[39,38]},arrows:[[34,40,40,32,'press'],[34,52,39,38,'run']],txt:L('9 baskı yapıyor. 10 numara stoperle 6 arasına giriyor; 6’ya pas yolu gölgede kalıyor.','Die 9 presst. Der Zehner stellt sich zwischen IV und Sechser; der Passweg liegt im Schatten.','The 9 presses. The 10 steps between centre-back and 6; that lane is now in his shadow.','Le 9 presse. Le 10 se place entre le central et le 6 ; la ligne est dans son ombre.')},
  {p:{'7':[60,42]},ball:'F',arrows:[[44,28,62,38,'pass'],[56,50,60,42,'press']],txt:L('Merkez kapalı, top kenara gidiyor. Kenar bizim için bir tuzak.','Das Zentrum ist zu, der Ball geht nach außen. Die Seitenlinie wird zur Falle.','The middle is shut, the ball goes wide. The touchline becomes a trap.','L’axe est fermé, le ballon part sur le côté. La ligne de touche devient un piège.')},
  {ball:'7',txt:L('Kanatta sıkıştırıp topu kazanıyoruz.','Am Flügel festgesetzt, Ball gewonnen.','Trapped on the flank, ball won.','Piégé sur l’aile, ballon récupéré.')}],
 bad:[
  {p:{'9':[40,32],'10':[42,32]},zone:[34,42,4,'bad'],arrows:[[34,52,42,32,'run']],txt:L('Hata: 10 numara da stopere koşuyor. Rakibin 6’sı boşta kalıyor.','Fehler: Auch der Zehner läuft den IV an. Der Sechser ist frei.','Mistake: the 10 also runs at the centre-back. Their 6 is free.','Erreur : le 10 presse aussi le central. Leur 6 est libre.')},
  {p:{S:[34,46]},ball:'S',arrows:[[44,28,34,44,'pass']],txt:L('Pas 6 numaraya; baskının arkasından çıkıyorlar.','Pass auf den Sechser, sie spielen sich aus dem Pressing.','The ball goes into their 6; they play out of our press.','Le ballon arrive à leur 6 ; ils sortent du pressing.')},
  {ball:[34,72],arrows:[[34,46,34,72,'pass']],txt:L('Tek pasla iki hattımız geçildi.','Ein Pass, und zwei unserer Linien sind überspielt.','One pass and two of our lines are beaten.','Une passe et deux de nos lignes sont dépassées.')}]},

{id:'yonlendir-pres',phase:'def',lvl:1,tags:['ST','W'],view:'mid',
 title:L('Forvet baskısı: kavisli koş, yönlendir','Stürmerpressing: im Bogen anlaufen, lenken','Striker pressing: curve your run, steer play','Pressing de l’attaquant : course courbée, orienter'),
 sum:L('Düz koşma; vücudunla diğer stopere giden pası kapat ve topu kenara zorla.','Nicht gerade anlaufen: mit dem Körper den Pass zum anderen IV schließen, nach außen zwingen.','Don’t run straight: block the pass to the other centre-back with your body and force it wide.','Ne cours pas droit : ferme la passe vers l’autre central avec ton corps, force vers le côté.'),
 actors:[['9','us',34,42],['11','us',14,50],['8','us',26,54],['A','op',24,28],['B','op',44,28],['S','op',34,38],['F','op',8,36]],ball:'A',
 intro:{txt:L('Top rakip stoperde (A). Diğer stoper (B) ve 6 numara pas bekliyor.','Der IV (A) hat den Ball. Der andere IV und der Sechser bieten sich an.','Their centre-back (A) has the ball. The other centre-back and their 6 are options.','Leur central (A) a le ballon. L’autre central et leur 6 sont des options.')},
 good:[
  {p:{'9':[29,31]},arrows:[[34,42,29,31,'press']],zone:[34,28,4,'good'],txt:L('9 numara kavisli koşuyla geliyor ve vücuduyla diğer stopere giden pası kesiyor.','Die 9 läuft im Bogen an und schneidet mit dem Körper den Pass zum anderen IV ab.','The 9 comes with a curved run and cuts off the pass to the other centre-back.','Le 9 arrive en courbe et coupe avec son corps la passe vers l’autre central.')},
  {p:{'11':[10,40]},ball:'F',arrows:[[24,28,8,36,'pass'],[14,50,10,40,'press']],txt:L('Tek seçenek kalıyor: kenara pas. 11 numara hemen bekin üzerine çıkıyor.','Einzige Option: der Pass nach außen. Die 11 läuft sofort den AV an.','The only option left is wide. The 11 jumps on their full-back at once.','Seule option : la passe sur le côté. Le 11 saute aussitôt sur le latéral.')},
  {p:{'8':[14,42]},ball:'11',arrows:[[26,54,14,42,'run']],txt:L('Çizgiyi de kullanarak sıkıştırıp topu kazanıyoruz.','Mit der Seitenlinie als Helfer gewinnen wir den Ball.','Using the touchline as an extra defender, we win the ball.','En utilisant la ligne de touche, on récupère le ballon.')}],
 bad:[
  {p:{'9':[25,31]},arrows:[[34,42,25,31,'press']],txt:L('Hata: 9 numara topa düz koşuyor. Her iki pas yolu da açık.','Fehler: Die 9 läuft gerade auf den Ball. Beide Passwege sind offen.','Mistake: the 9 runs straight at the ball. Both passing lanes are open.','Erreur : le 9 court droit sur le ballon. Les deux lignes sont ouvertes.')},
  {ball:'B',arrows:[[24,28,44,28,'pass']],txt:L('Top diğer stopere gidiyor; koşu boşa gitti.','Der Ball geht zum anderen IV, der Lauf war umsonst.','The ball goes across to the other centre-back; the run was wasted.','Le ballon passe à l’autre central ; la course est perdue.')},
  {ball:[44,64],arrows:[[44,28,44,64,'pass']],txt:L('Rakip rahatça ileri oynuyor.','Der Gegner spielt ungestört nach vorn.','They play forward without pressure.','Ils jouent vers l’avant sans pression.')}]},

{id:'uzun-top',phase:'def',lvl:1,tags:['CB'],view:'def',

  {ball:'4',p:{'4':[32,86]},txt:L('Seken top 4 numaranın önüne düşüyor.','Der abgefälschte Ball landet bei der 4.','The knock-down drops in front of the 4.','Le ballon dévié tombe devant le 4.')}],
 bad:[
  {p:{'5':[37,77],'4':[35,78]},arrows:[[40,80,37,77,'press'],[30,80,35,78,'press']],zone:[30,88,5,'bad'],txt:L('Hata: iki stoper de aynı topa çıkıyor. Arkada kimse yok.','Fehler: Beide IV gehen zum selben Ball. Dahinter ist niemand.','Mistake: both centre-backs go for the same ball. Nobody is behind.','Erreur : les deux centraux vont au même ballon. Personne derrière.')},
  {p:{Y:[30,88]},ball:'Y',arrows:[[24,74,30,88,'run']],txt:L('Forvet topu arkaya indiriyor; koşan rakip boşta.','Der Stürmer verlängert, der Läufer ist frei.','The striker flicks it on and the runner is free.','L’attaquant prolonge, le coureur est seul.')},
  {p:{Y:[32,97]},ball:[33,105.6],txt:L('Gol.','Tor.','Goal.','But.')}]},

{id:'orta-pres',phase:'def',lvl:3,tags:['CM','DM','AM'],view:'mid',
 title:L('Orta saha baskısı: sinyali yakala','Mittelfeldpressing: den Auslöser erkennen','Midfield press: read the trigger','Pressing au milieu : lire le signal'),
 sum:L('Rakip sırtı dönük alınca bir kişi baskıya çıkar, diğerleri yan pasları kapatır.','Nimmt der Gegner mit dem Rücken zum Tor an, presst einer, die anderen schließen die Seiten.','When they receive facing their own goal, one presses and the others shut the side passes.','Quand l’adversaire reçoit dos au jeu, un presse et les autres ferment les côtés.'),
 actors:[['8','us',40,58],['10','us',28,52],['7','us',56,54],['6','us',34,64],['P','op',40,30],['O','op',40,46],['Q','op',26,44],['R','op',54,44]],ball:'P',

  {ball:'O',p:{O:[40,48]},arrows:[[40,30,40,48,'pass']],txt:L('Rakip topu sırtı dönük alıyor. Bu, baskı sinyali.','Er nimmt mit dem Rücken zum Spiel an. Das ist der Auslöser.','He receives with his back to play. That is the trigger.','Il reçoit dos au jeu. C’est le signal.')},
  {p:{'8':[40,52],'10':[31,47],'7':[51,48],'6':[40,58]},arrows:[[40,58,40,52,'press'],[28,52,31,47,'run'],[56,54,51,48,'run'],[34,64,40,58,'run']],txt:L('8 arkadan baskıya çıkıyor. 10 ve 7 yan pasları kesiyor, 6 arkayı tutuyor.','Die 8 presst von hinten. 10 und 7 schneiden die Seitenpässe ab, die 6 sichert.','The 8 presses from behind. The 10 and 7 cut the side passes, the 6 covers.','Le 8 presse dans le dos. Le 10 et le 7 coupent les passes latérales, le 6 couvre.')},
  {ball:'8',txt:L('Rakip dönemiyor ve top kazanılıyor.','Er kann nicht aufdrehen, der Ball ist gewonnen.','He can’t turn, and the ball is won.','Il ne peut pas se retourner, ballon récupéré.')}],
 bad:[
  {ball:'O',p:{O:[40,48]},arrows:[[40,30,40,48,'pass']],txt:L('Rakip topu sırtı dönük alıyor.','Er nimmt mit dem Rücken zum Spiel an.','He receives with his back to play.','Il reçoit dos au jeu.')},
  {p:{'8':[40,52]},arrows:[[40,58,40,52,'press']],zone:[26,46,4,'bad'],txt:L('Hata: 8 tek başına baskıya çıkıyor. Diğerleri yerinde kalıyor.','Fehler: Die 8 presst allein. Die anderen bleiben stehen.','Mistake: the 8 presses alone. The others stay where they are.','Erreur : le 8 presse seul. Les autres ne bougent pas.')},
  {p:{Q:[24,52]},ball:'Q',arrows:[[40,48,26,46,'pass'],[26,44,24,52,'run']],txt:L('Rakip yana oynuyor. 8 oyun dışı kaldı, arkasında boşluk var.','Er legt zur Seite ab. Die 8 ist überspielt, dahinter ist Platz.','He lays it off to the side. The 8 is beaten and there is space behind.','Il remet sur le côté. Le 8 est éliminé, il y a de l’espace derrière.')}]},

{id:'arka-denge',phase:'trans',lvl:3,tags:['DM','CB','FB'],view:'full',

  {ball:'W',arrows:[[44,44,56,52,'pass']],txt:L('Top kaybı; rakip kanat boş alana dönüyor.','Ballverlust, ihr Flügel dreht in den freien Raum.','Ball lost; their winger turns into the empty space.','Ballon perdu ; leur ailier se retourne vers l’espace libre.')},
  {p:{W:[60,82],'5':[52,84]},arrows:[[56,52,60,82,'run'],[42,80,52,84,'run']],txt:L('Kontra atak. Stoper kenara çekiliyor ve ceza sahası boşalıyor.','Konter. Der IV wird nach außen gezogen, der Strafraum ist leer.','Counter-attack. The centre-back is pulled wide and the box empties.','Contre-attaque. Le central est attiré sur le côté, la surface se vide.')}]},

{id:'korner-hucum',phase:'set',lvl:3,tags:['CB','ST'],view:'att',

// ================= app state =================
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('ttsc_lang')||((navigator.language||'tr').slice(0,2));if(!UI[lang])lang='tr';
const $=id=>document.getElementById(id);
// inside the TTSC app (an iframe) lesson changes must not pile up in the phone's back history
const EMB=window.parent!==window;
function nav(h){if(EMB)location.replace('#'+h);else location.hash=h}
const t=k=>(UI[lang][k]||UI.tr[k]||k);
const loc=o=>o?(o[lang]||o.tr):'';
let filter='all',cur=null,variant='good',step=0,anim=1,playing=false,hold=0,formation=store.get('ttsc_taktik_form')||'4-1-4-1',phase=0,fk=1,sel=-1;
