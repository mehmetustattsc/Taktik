<style>
/* Layout: coaching playbook — tab bar, then either a lesson library (cards by position) or a board view with narration under the pitch */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#13201b; --muted:#5d6e66; --line:#d5ddd8;
  --accent:#0f6b54; --accent-ink:#ffffff; --bad:#c2412b; --good:#16794f;
  --display:'Archivo','Arial Narrow',sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1411; --surface:#131e19; --ink:#e4ede8; --muted:#90a39a; --line:#25352d;
  --accent:#5fd3a5; --accent-ink:#06231a; --bad:#ff8a73; --good:#6fe0a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#131e19; --ink:#e4ede8; --muted:#90a39a; --line:#25352d;
  --accent:#5fd3a5; --accent-ink:#06231a; --bad:#ff8a73; --good:#6fe0a8; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;margin:0;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.01em;margin:0;line-height:1}
h1 small{display:block;font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:600 13px var(--body)}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:700 15px var(--body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.packhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.packhead h2{font-family:var(--display);font-size:20px;margin:0}
.packhead span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-width:0}
.lcard:hover{border-color:var(--accent)}
.lcard b{font-family:var(--display);font-size:17px;line-height:1.2}
.lcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.soon{color:var(--muted);font-size:14px;margin:0}
.boardbox{display:flex;flex-direction:column;gap:10px}
.back{align-self:flex-start;background:none;border:0;color:var(--accent);font:700 14px var(--body);cursor:pointer;padding:4px 0}
.ltitle{font-family:var(--display);font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
canvas{display:block;width:100%;border-radius:10px;touch-action:manipulation}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg button{background:var(--surface);border:0;padding:8px 14px;font:700 14px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"].w{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].r{background:var(--good);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--accent);color:var(--accent-ink)}
.narr{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;min-height:56px;font-size:17px;line-height:1.45}
.narr.bad{border-left-color:var(--bad)} .narr.good{border-left-color:var(--good)}
.narr .k{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:700 15px var(--body);color:var(--ink);cursor:pointer;min-width:48px}
.cbtn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cbtn:disabled{opacity:.4}
.dots{display:flex;gap:5px;margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:5px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.45}
.role b{font-family:var(--display)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Taktik<small data-i="sub"></small></h1>
    <select id="lang" aria-label="Language"><option value="tr">TR</option><option value="de">DE</option><option value="en">EN</option><option value="fr">FR</option></select>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabL" role="tab" data-i="lessons"></button>
    <button class="tab" id="tabF" role="tab" data-i="formations"></button>
  </div>

  <section id="vList">
    <div class="boardbox">
      <div class="chips" id="chips"></div>
      <div class="packhead"><h2 data-i="pack"></h2><span id="count"></span></div>
      <div class="grid" id="grid"></div>
      <p class="soon" data-i="soon"></p>
    </div>
  </section>

  <section id="vLesson" hidden>
    <div class="boardbox">
      <button class="back" id="back">← <span data-i="backAll"></span></button>
      <h2 class="ltitle" id="lTitle"></h2>
      <div class="seg" id="variant"><button class="w" id="vBad" data-i="wrong"></button><button class="r" id="vGood" data-i="right"></button></div>
      <canvas id="cvL" aria-label="Board"></canvas>
      <div class="legend"><span><i style="background:#ffffff;border:1px solid #9aa"></i><span data-i="us"></span></span><span><i style="background:#e4573d"></i><span data-i="them"></span></span><span><i style="background:#f5b83d"></i><span data-i="moves"></span></span></div>
      <div class="narr" id="narr" aria-live="polite"></div>
      <div class="ctrl">
        <button class="cbtn" id="prev" aria-label="Prev">◀</button>
        <button class="cbtn main" id="play"></button>
        <button class="cbtn" id="next" aria-label="Next">▶</button>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </section>

  <section id="vForm" hidden>
    <div class="boardbox">
      <div class="chips" id="fchips"></div>
      <div class="seg" id="phase"><button class="n" id="pDef" data-i="defense"></button><button class="n" id="pAtt" data-i="attack"></button></div>
      <canvas id="cvF" aria-label="Formation"></canvas>
      <div class="role" id="role"></div>
    </div>
  </section>
</div>

tr:{GK:['Savunma arkasını kontrol et, hattı konuşarak yönet.','Oyun kurmaya katıl, kısa ve uzun seçeneği gör.'],CB:['Hattı birlikte tut, öndeki forveti kontrol et.','Genişle, topu ileri taşı veya hattı kıran pası ara.'],FB:['Kanadı kapat, içteki stoperle mesafeni koru.','Kanattan bindir. Kanat içeri kat ederse çizgi senin.'],WB:['Beşli hatta düş, rakip kanadı karşıla.','Tüm kanadı sen kullanırsın; genişliği sen verirsin.'],DM:['Stoperlerin önünü koru, pas yollarını kapat.','Stoperlerin arasına ya da önüne gel, oyunu yönlendir.'],CM:['Kompakt kal, merkezi kapat, baskıyı başlat.','Yarı alanlarda pas açısı ver, ceza sahasına koş.'],AM:['Rakibin 6 numarasını gölgende tut.','Hatlar arasında top iste, son pası ara.'],W:['Bekinin önünü kapat, rakip beki takip et.','Bekin bindirmesine göre çizgide kal ya da içeri kat et.'],ST:['Baskıyı başlat, oyunu bir kanada yönlendir.','Stoperleri meşgul et, savunma arkasına koş.']},
de:{GK:['Raum hinter der Kette sichern und die Kette dirigieren.','Im Aufbau mitspielen, kurze und lange Option sehen.'],CB:['Kette gemeinsam halten, den Stürmer kontrollieren.','Breit machen, andribbeln oder linienbrechend passen.'],FB:['Flügel schließen, Abstand zum Innenverteidiger halten.','Hinterlaufen. Zieht der Flügel nach innen, gehört dir die Linie.'],WB:['In die Fünferkette fallen, Flügelspieler stellen.','Du gibst die Breite über die ganze Seite.'],DM:['Raum vor der Abwehr schützen, Passwege schließen.','Zwischen oder vor die Innenverteidiger kommen, Spiel lenken.'],CM:['Kompakt bleiben, Zentrum schließen, Pressing auslösen.','In den Halbräumen anbieten, in den Strafraum starten.'],AM:['Den gegnerischen Sechser im Deckungsschatten halten.','Zwischen den Linien anbieten, den letzten Pass suchen.'],W:['Vor dem Außenverteidiger schließen, gegnerischen AV verfolgen.','Je nach Hinterlaufen breit bleiben oder nach innen ziehen.'],ST:['Pressing starten, Spiel auf eine Seite lenken.','Innenverteidiger binden, in die Tiefe starten.']},
en:{GK:['Guard the space behind the line and organise it.','Join the build-up; see the short and the long option.'],CB:['Hold the line together and control the striker.','Split wide, carry the ball or play the line-breaking pass.'],FB:['Close the flank, keep the gap to your centre-back.','Overlap. When the winger cuts inside, the touchline is yours.'],WB:['Drop into the back five and meet the winger.','You give width along the whole flank.'],DM:['Screen the back line and block passing lanes.','Drop between or ahead of the centre-backs and direct play.'],CM:['Stay compact, close the centre, trigger the press.','Offer angles in the half-spaces and run into the box.'],AM:['Keep their number 6 in your cover shadow.','Receive between the lines and look for the final pass.'],W:['Screen in front of your full-back, track their full-back.','Hold width or cut inside, depending on the overlap.'],ST:['Start the press and force play to one side.','Pin the centre-backs and run in behind.']},

{id:'markaj',tags:['FB','CB'],view:'def',

 good:[
  {p:{M:[41,60],W:[59,71],'2':[55,76]},arrows:[[59,71,34,105,'guide']],txt:L('Doğru konum: adamla kale arasında, iç omuzda. Hem adamı hem topu görüyorsun.','Richtig: zwischen Gegner und Tor, an der inneren Schulter. Du siehst Mann und Ball.','Right: between man and goal, on his inside shoulder. You see man and ball.','Juste : entre l’homme et le but, à l’épaule intérieure. Tu vois l’homme et le ballon.')},
  {p:{W:[59,73],'2':[57,76]},ball:'W',arrows:[[41,60,59,73,'pass']],txt:L('Pas yoldayken yaklaş. Top ayağa geldiğinde bir kol mesafesindesin.','Rück heran, solange der Pass unterwegs ist. Bei der Annahme bist du eine Armlänge entfernt.','Close in while the pass travels. When it arrives you are an arm’s length away.','Approche pendant que la passe voyage. À la réception, tu es à une longueur de bras.')},
  {p:{W:[62,82],'2':[59,83]},arrows:[[59,73,62,82,'run']],txt:L('İçeriyi kapattığın için rakip dışarı, daha az tehlikeli bölgeye gidiyor.','Weil du innen zu machst, muss er nach außen in die ungefährlichere Zone.','Because you shut the inside, he has to go wide, into less danger.','Comme tu fermes l’intérieur, il doit partir à l’extérieur, moins dangereux.')}],
 bad:[
  {p:{M:[41,60],W:[60,80],'2':[50,74]},arrows:[[59,68,60,80,'run']],txt:L('Hata: bek sadece topa bakıyor. Adam arkasına koşuyor.','Fehler: Der AV schaut nur auf den Ball. Der Gegner läuft in seinen Rücken.','Mistake: the full-back only watches the ball. His man runs in behind.','Erreur : le latéral ne regarde que le ballon. Son joueur file dans son dos.')},
  {p:{W:[60,85],'2':[54,80]},ball:'W',arrows:[[41,60,60,85,'pass']],txt:L('Pas savunma arkasına gidiyor. Bek yarışı geride başlıyor.','Der Pass geht hinter die Abwehr. Der AV startet das Laufduell von hinten.','The pass goes in behind. The full-back starts the race from behind.','La passe part dans le dos. Le latéral démarre la course en retard.')},
  {p:{W:[48,93],'2':[54,88]},arrows:[[60,85,48,93,'run']],txt:L('Rakip kaleye doğru serbest kalıyor.','Der Gegner läuft frei aufs Tor zu.','He is free, heading for goal.','Il est libre et file vers le but.')}]},

{id:'alan',tags:['CB','FB','DM'],view:'def',

  {p:{A:[60,64],'2':[57,70],'5':[46,77],'4':[35,79],'3':[25,78],'6':[42,68]},ball:'A',arrows:[[34,57,60,64,'pass']],txt:L('Top kanada gidiyor. Bek (2) baskıya çıkar, diğerleri topa doğru kayar, uzak bek (3) içeri daralır.','Der Ball geht auf den Flügel. AV (2) presst, die anderen verschieben, der ballferne AV (3) rückt ein.','The ball goes wide. Full-back (2) presses, the rest shift across, the far full-back (3) tucks in.','Le ballon va sur le côté. Le latéral (2) presse, les autres coulissent, le latéral opposé (3) resserre.')},
  {p:{R:[22,82],'3':[23,82]},arrows:[[20,66,22,82,'run']],txt:L('Arkaya koşan rakip, içeri daralmış bek tarafından karşılanıyor.','Der Läufer in die Tiefe wird vom eingerückten AV aufgenommen.','The runner in behind is picked up by the tucked-in full-back.','Le coureur dans la profondeur est pris par le latéral resserré.')},
  {p:{A:[62,60],M:[36,56],'2':[54,76],'5':[40,80],'4':[28,80],'3':[16,79],'6':[34,69]},ball:'M',arrows:[[60,64,36,56,'pass']],txt:L('Top geri merkeze gelince hat yeniden ortalanır. Aralar 8–10 metreyi geçmez.','Kommt der Ball zurück ins Zentrum, zentriert sich die Kette wieder. Abstände bleiben bei 8–10 Metern.','When the ball returns centrally, the line re-centres. Gaps stay at 8–10 metres.','Ballon de retour dans l’axe : la ligne se recentre. Les écarts restent de 8 à 10 m.')}],

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('ttsc_lang')||((navigator.language||'tr').slice(0,2));if(!UI[lang])lang='tr';
const $=id=>document.getElementById(id);

const loc=o=>o?(o[lang]||o.tr):'';

function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('lang').value=lang;renderList();renderFChips();if(cur)renderLessonText();renderRole()}

// ---------- list ----------
function renderList(){
  const used=['all',...new Set(LESSONS.flatMap(l=>l.tags))];
  $('chips').innerHTML='';
  used.forEach(r=>{const b=document.createElement('button');b.className='chip';b.textContent=r==='all'?t('all'):ROLE[lang][r][0];b.setAttribute('aria-pressed',filter===r);b.onclick=()=>{filter=r;renderList()};$('chips').appendChild(b)});
  const list=LESSONS.filter(l=>filter==='all'||l.tags.includes(filter));
  $('count').textContent=t('lessonsN').replace('{n}',list.length);
  $('grid').innerHTML='';
  list.forEach(l=>{const b=document.createElement('button');b.className='lcard';
    b.innerHTML=`<span class="tags">${l.tags.map(g=>`<span class="tag">${ROLE[lang][g][1]}</span>`).join('')}</span><b></b><p></p>`;
    b.querySelector('b').textContent=loc(l.title);b.querySelector('p').textContent=loc(l.sum);
    b.onclick=()=>{location.hash='ders-'+l.id};$('grid').appendChild(b)});
}

// ---------- routing ----------
function route(){
  const h=location.hash.slice(1);
  const lesson=h.startsWith('ders-')?LESSONS.find(l=>'ders-'+l.id===h):null;
  $('vList').hidden=!!lesson||h==='dizilis';$('vLesson').hidden=!lesson;$('vForm').hidden=h!=='dizilis';
  $('tabL').setAttribute('aria-selected',h!=='dizilis');$('tabF').setAttribute('aria-selected',h==='dizilis');
  if(lesson)openLesson(lesson);else{cur=null;playing=false}
  if(h==='dizilis'){fk=1;sizeAll()}
}
window.addEventListener('hashchange',route);
$('tabL').onclick=()=>{location.hash='dersler'};$('tabF').onclick=()=>{location.hash='dizilis'};
$('back').onclick=()=>{location.hash='dersler'};

// ---------- lesson engine ----------
function steps(){return[cur.intro,...cur[variant]]}
function stateAt(i){
  const pos={};cur.actors.forEach(a=>pos[a[0]]=[a[2],a[3]]);let ball=cur.ball,line=null;
  const s=steps();for(let j=0;j<=i;j++){const st=s[j];if(st.p)for(const k in st.p)pos[k]=st.p[k];if(st.ball!==undefined)ball=st.ball;line=st.line||null}
  return{pos,ball,line};
}
function openLesson(l){
  const same=cur===l;cur=l;if(!same){variant='bad';step=0;anim=1;playing=false}
  sizeAll();renderLessonText();
}
function renderLessonText(){
  $('lTitle').textContent=loc(cur.title);
  $('vBad').setAttribute('aria-pressed',variant==='bad');$('vGood').setAttribute('aria-pressed',variant==='good');
  const s=steps();const n=$('narr');n.className='narr '+(step===0?'':variant);
  n.innerHTML=`<span class="k">${t('step')} ${step+1}/${s.length} · ${variant==='bad'?t('wrong'):t('right')}</span><span></span>`;n.lastChild.textContent=loc(s[step].txt);
  $('dots').innerHTML=s.map((_,i)=>`<span class="dot${i<=step?' on':''}"></span>`).join('');
  $('prev').disabled=step===0;$('next').disabled=step>=s.length-1;
  $('play').textContent=playing?t('pause'):(step>=s.length-1?t('again'):t('play'));
}
function go(i){const s=steps();i=Math.max(0,Math.min(s.length-1,i));if(i===step)return;step=i;anim=0;hold=0;renderLessonText()}
$('prev').onclick=()=>{playing=false;go(step-1)};
$('next').onclick=()=>{playing=false;go(step+1)};
$('play').onclick=()=>{const s=steps();if(playing){playing=false}else{if(step>=s.length-1){step=0;anim=1}playing=true;hold=0}renderLessonText()};
$('vBad').onclick=()=>{variant='bad';step=0;anim=1;playing=true;hold=0;renderLessonText()};
$('vGood').onclick=()=>{variant='good';step=0;anim=1;playing=true;hold=0;renderLessonText()};

  cv.style.width=cw+'px';cv.style.height=ch+'px';const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);cv._v=v;cv._s=cv.width/(v[2]-v[0]);cv._d=d}

const P=(cv,x,y)=>[(x-cv._v[0])*cv._s,(y-cv._v[1])*cv._s];

  g.strokeStyle='rgba(235,245,240,.7)';g.lineWidth=1.6*cv._d;
  const R=(x0,y0,x1,y1)=>{const[a,b]=P(cv,x0,y0),[c,d]=P(cv,x1,y1);g.strokeRect(a,b,c-a,d-b)};
  R(0,0,68,105);R(13.84,0,54.16,16.5);R(24.84,0,43.16,5.5);R(13.84,88.5,54.16,105);R(24.84,99.5,43.16,105);
  g.beginPath();let[a,b]=P(cv,0,52.5),[c]=P(cv,68,52.5);g.moveTo(a,b);g.lineTo(c,b);g.stroke();
  const[cx,cy]=P(cv,34,52.5);g.beginPath();g.arc(cx,cy,9.15*cv._s,0,Math.PI*2);g.stroke();
  for(const yy of[11,94]){const[sx,sy]=P(cv,34,yy);g.beginPath();g.arc(sx,sy,1.6*cv._d,0,Math.PI*2);g.fillStyle='rgba(235,245,240,.7)';g.fill()}
  const[p1x,p1y]=P(cv,34,94);g.beginPath();g.arc(p1x,p1y,9.15*cv._s,Math.PI*1.21,Math.PI*1.79);g.stroke();

}
function disc(g,cv,x,y,team,label,hi){
  const[px,py]=P(cv,x,y),r=11*cv._d;
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.arc(px+1.5*cv._d,py+2*cv._d,r,0,Math.PI*2);g.fill();
  g.fillStyle=team==='us'?'#ffffff':'#e4573d';g.beginPath();g.arc(px,py,r,0,Math.PI*2);g.fill();
  if(hi){g.strokeStyle='#f5b83d';g.lineWidth=3*cv._d;g.beginPath();g.arc(px,py,r+4*cv._d,0,Math.PI*2);g.stroke()}
  if(label){g.fillStyle=team==='us'?'#13302a':'#ffffff';g.font=`700 ${(label.length>2?9:11)*cv._d}px "Source Sans 3",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(label,px,py+.5*cv._d)}
}
function arrow(g,cv,x1,y1,x2,y2,kind,alpha){
  const[a,b]=P(cv,x1,y1),[c,d]=P(cv,x2,y2);g.globalAlpha=alpha;
  const col=kind==='guide'?'rgba(235,245,240,.85)':'#f5b83d';g.strokeStyle=col;g.fillStyle=col;g.lineWidth=(kind==='pass'?2.6:2.2)*cv._d;
  g.setLineDash(kind==='run'?[6*cv._d,5*cv._d]:kind==='guide'?[2*cv._d,5*cv._d]:kind==='press'?[10*cv._d,3*cv._d]:[]);
  const ang=Math.atan2(d-b,c-a),off=14*cv._d;const ex=c-Math.cos(ang)*off,ey=d-Math.sin(ang)*off;
  g.beginPath();g.moveTo(a,b);g.lineTo(ex,ey);g.stroke();g.setLineDash([]);
  if(kind!=='guide'){g.beginPath();g.moveTo(ex+Math.cos(ang)*8*cv._d,ey+Math.sin(ang)*8*cv._d);g.lineTo(ex+Math.cos(ang+2.5)*7*cv._d,ey+Math.sin(ang+2.5)*7*cv._d);g.lineTo(ex+Math.cos(ang-2.5)*7*cv._d,ey+Math.sin(ang-2.5)*7*cv._d);g.fill()}
  g.globalAlpha=1;
}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function ballXY(st,pos){if(typeof st.ball==='string'){const p=pos[st.ball];return[p[0]+1.1,p[1]-1.4]}return st.ball}
function drawLesson(){
  const g=gL,cv=cvL;if(!cv._v)return;pitch(g,cv);
  const a=stateAt(Math.max(0,step-1)),b=stateAt(step),k=ease(Math.min(1,anim));
  const pos={};for(const id in b.pos){const p0=a.pos[id],p1=b.pos[id];pos[id]=[p0[0]+(p1[0]-p0[0])*k,p0[1]+(p1[1]-p0[1])*k]}
  const s=steps()[step];
  if(b.line){const[x0,y0]=P(cv,0,b.line[0]),[x1]=P(cv,68,b.line[0]);g.strokeStyle=b.line[1]==='bad'?'#ff6b55':'#8af0c0';g.lineWidth=2*cv._d;g.setLineDash([8*cv._d,6*cv._d]);g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y0);g.stroke();g.setLineDash([])}
  if(s.zone){const[zx,zy]=P(cv,s.zone[0],s.zone[1]);g.globalAlpha=Math.min(1,anim*1.5)*.45;g.fillStyle=s.zone[3]==='bad'?'#ff5d4a':'#5fe3a8';g.beginPath();g.arc(zx,zy,s.zone[2]*cv._s,0,Math.PI*2);g.fill();g.globalAlpha=1}
  if(s.arrows)s.arrows.forEach(r=>arrow(g,cv,r[0],r[1],r[2],r[3],r[4],Math.min(1,.25+anim)));
  cur.actors.forEach(ac=>{const p=pos[ac[0]];disc(g,cv,p[0],p[1],ac[1],ac[1]==='us'?ac[0]:'')});
  const b0=ballXY(a,pos),b1=ballXY(b,pos),bx=b0[0]+(b1[0]-b0[0])*k,by=b0[1]+(b1[1]-b0[1])*k;const[px,py]=P(cv,bx,by);
  g.fillStyle='#ffffff';g.beginPath();g.arc(px,py,4.5*cv._d,0,Math.PI*2);g.fill();g.strokeStyle='#111';g.lineWidth=1.2*cv._d;g.stroke();
}

// ---------- formations ----------
function renderFChips(){$('fchips').innerHTML='';Object.keys(FORM).forEach(f=>{const b=document.createElement('button');b.className='chip';b.textContent=f;b.setAttribute('aria-pressed',f===formation);b.onclick=()=>{formation=f;store.set('ttsc_taktik_form',f);sel=-1;fk=1;renderFChips();renderRole()};$('fchips').appendChild(b)});
  $('pDef').setAttribute('aria-pressed',phase===0);$('pAtt').setAttribute('aria-pressed',phase===1)}
function setPhase(p){if(p===phase)return;phase=p;fk=0;renderFChips();renderRole()}
$('pDef').onclick=()=>setPhase(0);$('pAtt').onclick=()=>setPhase(1);
function fpos(i){const r=FORM[formation][i],k=ease(Math.min(1,fk));const from=phase===1?[r[1],r[2]]:[r[3],r[4]],to=phase===1?[r[3],r[4]]:[r[1],r[2]];return[from[0]+(to[0]-from[0])*k,from[1]+(to[1]-from[1])*k]}
function drawForm(){const g=gF,cv=cvF;if(!cv._v)return;pitch(g,cv);
  FORM[formation].forEach((r,i)=>{const p=fpos(i);disc(g,cv,p[0],p[1],'us',ROLE[lang][r[0]][1],i===sel)})}
function renderRole(){const box=$('role');if(sel<0){box.textContent=t('tapHint');return}const r=FORM[formation][sel][0];
  box.innerHTML='<b></b><br><span></span>';box.firstChild.textContent=ROLE[lang][r][0]+' · '+(phase?t('attack'):t('defense'));box.lastChild.textContent=JOB[lang][r][phase]}
cvF.addEventListener('pointerdown',e=>{const rc=cvF.getBoundingClientRect();const mx=(e.clientX-rc.left)*cvF._d,my=(e.clientY-rc.top)*cvF._d;let best=-1,bd=26*cvF._d;
  FORM[formation].forEach((r,i)=>{const p=fpos(i),[px,py]=P(cvF,p[0],p[1]);const d=Math.hypot(px-mx,py-my);if(d<bd){bd=d;best=i}});sel=best;renderRole()});

// ---------- loop ----------
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(cur&&!$('vLesson').hidden){if(anim<1)anim=Math.min(1,anim+dt/1.2);else if(playing){hold+=dt;const txt=loc(steps()[step].txt);if(hold>1.6+txt.length*.035){if(step<steps().length-1)go(step+1);else{playing=false;renderLessonText()}}}drawLesson()}
  if(!$('vForm').hidden){if(fk<1)fk=Math.min(1,fk+dt/1.3);drawForm()}
  requestAnimationFrame(loop)}
$('lang').onchange=e=>{lang=e.target.value;store.set('ttsc_lang',lang);applyLang()};
applyLang();route();requestAnimationFrame(loop);
</script>
