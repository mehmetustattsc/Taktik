function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('lang').value=lang;renderList();renderFChips();if(cur)renderLessonText();renderRole();if(qList.length&&!$('vQuiz').hidden)renderQ()}

// ---------- list ----------
let fPhase='all',fLvl='all';
const PHASES=['def','att','trans','set'];
function filtered(){return LESSONS.filter(l=>(filter==='all'||l.tags.includes(filter))&&(fPhase==='all'||l.phase===fPhase)&&(fLvl==='all'||l.lvl===+fLvl))
  .sort((a,b)=>a.lvl-b.lvl||PHASES.indexOf(a.phase)-PHASES.indexOf(b.phase))}
function chipRow(box,items,curv,set){box.innerHTML='';items.forEach(([v,label])=>{const b=document.createElement('button');b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',String(curv)===String(v));b.onclick=()=>{set(v);renderList()};box.appendChild(b)})}
function renderList(){
  const nq=Math.min(QN,filtered().filter(l=>diverge(l)>0).length);$('quizSub').textContent=t('quizSub').replace('{n}',nq);$('quizGo').disabled=nq===0;
  chipRow($('chP'),[['all',t('all')],...PHASES.map(p=>[p,t(p)])],fPhase,v=>fPhase=v);
  chipRow($('chV'),[['all',t('all')],[1,t('lv1')],[2,t('lv2')],[3,t('lv3')]],fLvl,v=>fLvl=v);
  const used=[...new Set(LESSONS.flatMap(l=>l.tags))];
  chipRow($('chips'),[['all',t('all')],...used.map(r=>[r,ROLE[lang][r][0]])],filter,v=>filter=v);
  const list=filtered();
  $('count').textContent=t('lessonsN').replace('{n}',list.length);
  $('grid').innerHTML='';
  list.forEach(l=>{const b=document.createElement('button');b.className='lcard';
    b.innerHTML=`<span class="tags"><span class="tag">${t(l.phase)}</span><span class="tag">${t('lv'+l.lvl)}</span>${l.tags.map(g=>`<span class="tag">${ROLE[lang][g][1]}</span>`).join('')}</span><b></b><p></p>`;
    b.querySelector('b').textContent=loc(l.title);b.querySelector('p').textContent=loc(l.sum);
    b.onclick=()=>{nav('ders-'+l.id)};$('grid').appendChild(b)});
}
// ---------- routing ----------
function route(){
  const h=location.hash.slice(1);
  const lesson=h.startsWith('ders-')?LESSONS.find(l=>'ders-'+l.id===h):null;
  const quiz=h==='karar';
  $('vList').hidden=!!lesson||h==='dizilis'||quiz;$('vLesson').hidden=!lesson;$('vForm').hidden=h!=='dizilis';$('vQuiz').hidden=!quiz;
  if(quiz&&!qList.length){nav('dersler');return}
  if(quiz)sizeQ();
  $('tabL').setAttribute('aria-selected',h!=='dizilis');$('tabF').setAttribute('aria-selected',h==='dizilis');
  if(lesson)openLesson(lesson);else{cur=null;playing=false}
  if(h==='dizilis'){fk=1;sizeAll()}
}
window.addEventListener('hashchange',route);
$('tabL').onclick=()=>{nav('dersler')};$('tabF').onclick=()=>{nav('dizilis')};
$('back').onclick=()=>{nav('dersler')};

// ---------- lesson engine ----------
function stepsOf(l,v){return[l.intro,...l[v]]}
function stateOf(l,v,i){
  const pos={};l.actors.forEach(a=>pos[a[0]]=[a[2],a[3]]);let ball=l.ball,line=null;
  const s=stepsOf(l,v);for(let j=0;j<=Math.min(i,s.length-1);j++){const st=s[j];if(st.p)for(const k in st.p)pos[k]=st.p[k];if(st.ball!==undefined)ball=st.ball;line=st.line||null}
  return{pos,ball,line};
}
function steps(){return stepsOf(cur,variant)}
function stateAt(i){return stateOf(cur,variant,i)}
// first step where the right and wrong versions really differ on the pitch
function bxy(st){return typeof st.ball==='string'?st.pos[st.ball]:st.ball}
function diverge(l){const n=Math.min(l.good.length,l.bad.length);for(let j=1;j<=n;j++){const a=stateOf(l,'good',j),b=stateOf(l,'bad',j);
  const far=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1])>2;
  if(Object.keys(a.pos).some(id=>far(a.pos[id],b.pos[id]))||far(bxy(a),bxy(b)))return j}return 0}
function openLesson(l){
  const same=cur===l;cur=l;if(!same){variant='bad';step=0;anim=1;playing=autoPlay;hold=0}
  autoPlay=false;sizeAll();renderLessonText();
  if(!same&&slideDir){const bx=$('lbox');bx.classList.remove('slide-n','slide-p');void bx.offsetWidth;bx.classList.add(slideDir>0?'slide-n':'slide-p');slideDir=0}
  if(!same)window.scrollTo(0,0);
}
function navList(){const f=filtered();return f.includes(cur)?f:LESSONS}
let slideDir=0;
function goLesson(d){const L2=navList(),i=L2.indexOf(cur),n=L2.length;slideDir=d;autoPlay=true;nav('ders-'+L2[(i+d+n)%n].id)}
let autoPlay=false;
function renderLessonText(){
  const L2=navList();$('lMeta').innerHTML=`<span class="badge">${t(cur.phase)}</span><span class="badge lv">${t('lv'+cur.lvl)}</span><span>${L2.indexOf(cur)+1}${t('of')}${L2.length}</span>`;
  $('lTitle').textContent=loc(cur.title);
  $('vBad').setAttribute('aria-pressed',variant==='bad');$('vGood').setAttribute('aria-pressed',variant==='good');
  const s=steps();const n=$('narr');n.className='narr '+(step===0?'':variant);
  n.innerHTML=`<span class="k">${t('step')} ${step+1}/${s.length} · ${variant==='bad'?t('wrong'):t('right')}</span><span></span>`;n.lastChild.textContent=loc(s[step].txt);
  $('dots').innerHTML=s.map((_,i)=>`<span class="dot${i<=step?' on':''}"></span>`).join('');
  $('prev').disabled=step===0;$('next').disabled=step>=s.length-1;
  $('play').textContent=playing?t('pause'):(step>=s.length-1?t('again'):t('play'));
}
function go(i){const s=steps();i=Math.max(0,Math.min(s.length-1,i));if(i===step)return;step=i;anim=0;hold=0;renderLessonText()}
$('pl').onclick=()=>goLesson(-1);$('nl').onclick=()=>goLesson(1);
let sw=null;
$('vLesson').addEventListener('pointerdown',e=>{if(e.target.closest('button,select'))return;sw={x:e.clientX,y:e.clientY}});
$('vLesson').addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.abs(dx)>60&&Math.abs(dy)<50)goLesson(dx<0?1:-1)});
$('vLesson').addEventListener('pointercancel',()=>{sw=null});
window.addEventListener('keydown',e=>{if($('vLesson').hidden)return;if(e.key==='ArrowRight')goLesson(1);if(e.key==='ArrowLeft')goLesson(-1)});
$('prev').onclick=()=>{playing=false;go(step-1)};
$('next').onclick=()=>{playing=false;go(step+1)};
$('play').onclick=()=>{const s=steps();if(playing){playing=false}else{if(step>=s.length-1){step=0;anim=1}playing=true;hold=0}renderLessonText()};
$('vBad').onclick=()=>{variant='bad';step=0;anim=1;playing=true;hold=0;renderLessonText()};
$('vGood').onclick=()=>{variant='good';step=0;anim=1;playing=true;hold=0;renderLessonText()};

// ---------- canvas ----------
const VIEWS={def:[-2,48,70,107],att:[-2,-2,70,58],mid:[-2,18,70,82],full:[-3,-3,71,108]};
const cvL=$('cvL'),cvF=$('cvF'),gL=cvL.getContext('2d'),gF=cvF.getContext('2d');
function size(cv,view){const w=cv.parentElement.clientWidth||340;const v=VIEWS[view];let ar=(v[3]-v[1])/(v[2]-v[0]);let cw=w,ch=w*ar;const maxH=Math.max(320,window.innerHeight*.62);if(ch>maxH){ch=maxH;cw=ch/ar}
  cv.style.width=cw+'px';cv.style.height=ch+'px';const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);cv._v=v;cv._s=cv.width/(v[2]-v[0]);cv._d=d}
function sizeAll(){if(!$('vLesson').hidden)size(cvL,cur?cur.view:'def');if(!$('vForm').hidden)size(cvF,'full')}
window.addEventListener('resize',()=>{sizeAll();if(!$('vQuiz').hidden)sizeQ()});
const P=(cv,x,y)=>[(x-cv._v[0])*cv._s,(y-cv._v[1])*cv._s];
function pitch(g,cv){
  const v=cv._v;g.setTransform(1,0,0,1,0,0);g.fillStyle='#1d3a31';g.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<14;i++){if(i%2)continue;const[a,b]=P(cv,0,i*7.5),[c,d]=P(cv,68,(i+1)*7.5);g.fillStyle='#21423a';g.fillRect(a,b,c-a,d-b)}
  g.strokeStyle='rgba(235,245,240,.7)';g.lineWidth=1.6*cv._d;
  const R=(x0,y0,x1,y1)=>{const[a,b]=P(cv,x0,y0),[c,d]=P(cv,x1,y1);g.strokeRect(a,b,c-a,d-b)};
  R(0,0,68,105);R(13.84,0,54.16,16.5);R(24.84,0,43.16,5.5);R(13.84,88.5,54.16,105);R(24.84,99.5,43.16,105);
  g.beginPath();let[a,b]=P(cv,0,52.5),[c]=P(cv,68,52.5);g.moveTo(a,b);g.lineTo(c,b);g.stroke();
  const[cx,cy]=P(cv,34,52.5);g.beginPath();g.arc(cx,cy,9.15*cv._s,0,Math.PI*2);g.stroke();
  for(const yy of[11,94]){const[sx,sy]=P(cv,34,yy);g.beginPath();g.arc(sx,sy,1.6*cv._d,0,Math.PI*2);g.fillStyle='rgba(235,245,240,.7)';g.fill()}
  const[p1x,p1y]=P(cv,34,94);g.beginPath();g.arc(p1x,p1y,9.15*cv._s,Math.PI*1.21,Math.PI*1.79);g.stroke();
  const[p2x,p2y]=P(cv,34,11);g.beginPath();g.arc(p2x,p2y,9.15*cv._s,Math.PI*.21,Math.PI*.79);g.stroke();
  g.lineWidth=4*cv._d;for(const yy of[0,105]){const[a1,b1]=P(cv,30.34,yy),[a2]=P(cv,37.66,yy);g.beginPath();g.moveTo(a1,b1);g.lineTo(a2,b1);g.stroke()}
}
function disc(g,cv,x,y,team,label,hi){
  const[px,py]=P(cv,x,y),r=11*cv._d;
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.arc(px+1.5*cv._d,py+2*cv._d,r,0,Math.PI*2);g.fill();
  g.fillStyle=team==='us'?'#ffffff':'#e4573d';g.beginPath();g.arc(px,py,r,0,Math.PI*2);g.fill();
  if(hi){g.strokeStyle='#f5b83d';g.lineWidth=3*cv._d;g.beginPath();g.arc(px,py,r+4*cv._d,0,Math.PI*2);g.stroke()}
  if(label){g.fillStyle=team==='us'?'#13302a':'#ffffff';g.font=`700 ${(label.length>2?9:11)*cv._d}px "Source Sans 3",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(label,px,py+.5*cv._d)}
}
function arrow(g,cv,x1,y1,x2,y2,kind,alpha){
  const[a,b]=P(cv,x1,y1),[c,d]=P(cv,x2,y2);g.globalAlpha=alpha;
  const col=kind==='guide'?'rgba(235,245,240,.85)':'#f5b83d';g.strokeStyle=col;g.fillStyle=col;g.lineWidth=(kind==='pass'?2.6:2.2)*cv._d;
  g.setLineDash(kind==='run'?[6*cv._d,5*cv._d]:kind==='guide'?[2*cv._d,5*cv._d]:kind==='press'?[10*cv._d,3*cv._d]:[]);
  const ang=Math.atan2(d-b,c-a),off=14*cv._d;const ex=c-Math.cos(ang)*off,ey=d-Math.sin(ang)*off;
  g.beginPath();g.moveTo(a,b);g.lineTo(ex,ey);g.stroke();g.setLineDash([]);
  if(kind!=='guide'){g.beginPath();g.moveTo(ex+Math.cos(ang)*8*cv._d,ey+Math.sin(ang)*8*cv._d);g.lineTo(ex+Math.cos(ang+2.5)*7*cv._d,ey+Math.sin(ang+2.5)*7*cv._d);g.lineTo(ex+Math.cos(ang-2.5)*7*cv._d,ey+Math.sin(ang-2.5)*7*cv._d);g.fill()}
  g.globalAlpha=1;
}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function ballXY(st,pos){if(typeof st.ball==='string'){const p=pos[st.ball];return[p[0]+1.1,p[1]-1.4]}return st.ball}
function drawLesson(){drawScene(gL,cvL,cur,variant,step,anim,false)}
function drawScene(g,cv,l,v,i,an,neutral){
  if(!cv._v)return;pitch(g,cv);
  const a=stateOf(l,v,Math.max(0,i-1)),b=stateOf(l,v,i),k=ease(Math.min(1,an)),anim=an;
  const pos={};for(const id in b.pos){const p0=a.pos[id],p1=b.pos[id];pos[id]=[p0[0]+(p1[0]-p0[0])*k,p0[1]+(p1[1]-p0[1])*k]}
  const s=stepsOf(l,v)[i];
  if(b.line){const[x0,y0]=P(cv,0,b.line[0]),[x1]=P(cv,68,b.line[0]);g.strokeStyle=neutral?'rgba(235,245,240,.75)':b.line[1]==='bad'?'#ff6b55':'#8af0c0';g.lineWidth=2*cv._d;g.setLineDash([8*cv._d,6*cv._d]);g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y0);g.stroke();g.setLineDash([])}
  if(s.zone&&!neutral){const[zx,zy]=P(cv,s.zone[0],s.zone[1]);g.globalAlpha=Math.min(1,anim*1.5)*.45;g.fillStyle=s.zone[3]==='bad'?'#ff5d4a':'#5fe3a8';g.beginPath();g.arc(zx,zy,s.zone[2]*cv._s,0,Math.PI*2);g.fill();g.globalAlpha=1}
  if(s.arrows)s.arrows.forEach(r=>arrow(g,cv,r[0],r[1],r[2],r[3],r[4],Math.min(1,.25+anim)));
  l.actors.forEach(ac=>{const p=pos[ac[0]];disc(g,cv,p[0],p[1],ac[1],ac[1]==='us'?ac[0]:'')});
  const b0=ballXY(a,pos),b1=ballXY(b,pos),bx=b0[0]+(b1[0]-b0[0])*k,by=b0[1]+(b1[1]-b0[1])*k;const[px,py]=P(cv,bx,by);
  g.fillStyle='#ffffff';g.beginPath();g.arc(px,py,4.5*cv._d,0,Math.PI*2);g.fill();g.strokeStyle='#111';g.lineWidth=1.2*cv._d;g.stroke();
}

// ---------- formations ----------
function renderFChips(){$('fchips').innerHTML='';Object.keys(FORM).forEach(f=>{const b=document.createElement('button');b.className='chip';b.textContent=f;b.setAttribute('aria-pressed',f===formation);b.onclick=()=>{formation=f;store.set('ttsc_taktik_form',f);sel=-1;fk=1;renderFChips();renderRole()};$('fchips').appendChild(b)});
  $('pDef').setAttribute('aria-pressed',phase===0);$('pAtt').setAttribute('aria-pressed',phase===1)}
function setPhase(p){if(p===phase)return;phase=p;fk=0;renderFChips();renderRole()}
$('pDef').onclick=()=>setPhase(0);$('pAtt').onclick=()=>setPhase(1);
function fpos(i){const r=FORM[formation][i],k=ease(Math.min(1,fk));const from=phase===1?[r[1],r[2]]:[r[3],r[4]],to=phase===1?[r[3],r[4]]:[r[1],r[2]];return[from[0]+(to[0]-from[0])*k,from[1]+(to[1]-from[1])*k]}
function drawForm(){const g=gF,cv=cvF;if(!cv._v)return;pitch(g,cv);
  FORM[formation].forEach((r,i)=>{const p=fpos(i);disc(g,cv,p[0],p[1],'us',ROLE[lang][r[0]][1],i===sel)})}
function renderRole(){const box=$('role');if(sel<0){box.textContent=t('tapHint');return}const r=FORM[formation][sel][0];
  box.innerHTML='<b></b><br><span></span>';box.firstChild.textContent=ROLE[lang][r][0]+' · '+(phase?t('attack'):t('defense'));box.lastChild.textContent=JOB[lang][r][phase]}
cvF.addEventListener('pointerdown',e=>{const rc=cvF.getBoundingClientRect();const mx=(e.clientX-rc.left)*cvF._d,my=(e.clientY-rc.top)*cvF._d;let best=-1,bd=26*cvF._d;
  FORM[formation].forEach((r,i)=>{const p=fpos(i),[px,py]=P(cvF,p[0],p[1]);const d=Math.hypot(px-mx,py-my);if(d<bd){bd=d;best=i}});sel=best;renderRole()});

// ---------- quiz ----------
const QN=8,cvQ=$('cvQ'),gQ=cvQ.getContext('2d');
let qList=[],qi=0,qScore=0,qMap={},qPhase='ask',qPrev=null,qPS=0,qk=1,qD=0,qStep=0,qHold=0,qPicked=null;
function sizeQ(){if(qList[qi])size(cvQ,qList[qi].view)}
function startQuiz(){const pool=filtered().filter(l=>diverge(l)>0);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  qList=pool.slice(0,QN);qi=0;qScore=0;if(!qList.length)return;setupQ();nav('karar')}
function setupQ(){const l=qList[qi];qMap=Math.random()<.5?{A:'good',B:'bad'}:{A:'bad',B:'good'};qPhase='ask';qPrev=null;qPS=0;qk=1;qD=diverge(l);qStep=0;qHold=0;qPicked=null;sizeQ();renderQ();window.scrollTo(0,0)}
function renderQ(){const l=qList[qi];if(!l)return;
  $('qMeta').innerHTML=`<span class="badge">${t(l.phase)}</span><span class="badge lv">${t('lv'+l.lvl)}</span><span>${t('q')} ${qi+1}${t('of')}${qList.length} · ${qScore} ✓</span>`;
  $('qTitle').textContent=loc(l.title);
  const n=$('qNarr');
  if(qPhase==='end'){const pct=Math.round(qScore/qList.length*100);const prev=+(store.get('ttsc_taktik_quiz_best')||0);if(pct>prev)store.set('ttsc_taktik_quiz_best',pct);
    $('qMeta').innerHTML='';$('qTitle').textContent=t('result');n.className='narr good';n.innerHTML=`<span class="score">${qScore}/${qList.length}</span><span class="k">${t('best')}: ${Math.max(prev,pct)}%</span>`;
    try{window.parent.postMessage({source:'ttsc-games',game:'taktik-karar',score:qScore,questions:qList.length,accuracy:pct,lessons:qList.map(x=>x.id)},'*')}catch(e){}}
  else if(qPhase==='ask'){n.className='narr';n.innerHTML='<span class="k"></span><span></span>';n.firstChild.textContent=qPrev?t('watching').replace('{x}',qPrev):'';n.lastChild.textContent=t('ask')}
  else{const s=stepsOf(l,'good');const ok=qMap[qPicked]==='good';const right=qMap.A==='good'?'A':'B';n.className='narr '+(ok?'good':'bad');
    n.innerHTML='<span class="k"></span><span></span>';n.firstChild.textContent=(ok?t('yes'):t('no').replace('{x}',right))+' · '+t('right')+' '+(qStep+1)+'/'+s.length;n.lastChild.textContent=loc(s[qStep].txt)}
  $('qOpts').hidden=$('qPick').hidden=qPhase!=='ask';
  $('qA').textContent=t('optA');$('qB').textContent=t('optB');$('qPA').textContent=t('pickA');$('qPB').textContent=t('pickB');
  $('qA').setAttribute('aria-pressed',qPrev==='A');$('qB').setAttribute('aria-pressed',qPrev==='B');
  $('qAfter').hidden=!(qPhase==='reveal'&&qStep>=stepsOf(l,'good').length-1&&qk>=1);
  $('qNext').textContent=qi>=qList.length-1?t('finish'):t('nextQ');
  $('qEndBtns').hidden=qPhase!=='end';$('qAgain').textContent=t('again');$('qHome').textContent=t('home');
  $('cvQ').hidden=qPhase==='end';
}
function watch(x){if(qPhase!=='ask')return;qPrev=x;qPS=1;qk=0;renderQ()}
function pick(x){if(qPhase!=='ask')return;qPicked=x;if(qMap[x]==='good')qScore++;qPhase='reveal';qStep=0;qk=1;qHold=0;renderQ()}
$('quizGo').onclick=startQuiz;
$('qA').onclick=()=>watch('A');$('qB').onclick=()=>watch('B');$('qPA').onclick=()=>pick('A');$('qPB').onclick=()=>pick('B');
$('qNext').onclick=()=>{if(qi>=qList.length-1){qPhase='end';renderQ()}else{qi++;setupQ()}};
$('qAgain').onclick=()=>{startQuiz()};$('qHome').onclick=()=>{qList=[];nav('dersler')};
$('qBack').onclick=()=>{qList=[];nav('dersler')};
function quizTick(dt){const l=qList[qi];if(!l||qPhase==='end')return;
  if(qPhase==='ask'){if(!qPrev){drawScene(gQ,cvQ,l,'good',0,1,true);return}
    const v=qMap[qPrev];if(qk<1)qk=Math.min(1,qk+dt/1.1);else if(qPS<qD){qPS++;qk=0}
    drawScene(gQ,cvQ,l,v,qPS,qk,true)}
  else{const s=stepsOf(l,'good');if(qk<1)qk=Math.min(1,qk+dt/1.2);else if(qStep<s.length-1){qHold+=dt;if(qHold>1.4+loc(s[qStep].txt).length*.03){qStep++;qk=0;qHold=0;renderQ()}}else if($('qAfter').hidden)renderQ();
    drawScene(gQ,cvQ,l,'good',qStep,qk,false)}}

// ---------- loop ----------
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(cur&&!$('vLesson').hidden){if(anim<1)anim=Math.min(1,anim+dt/1.2);else if(playing){hold+=dt;const txt=loc(steps()[step].txt);if(hold>1.6+txt.length*.035){if(step<steps().length-1)go(step+1);else{playing=false;renderLessonText()}}}drawLesson()}
  if(!$('vQuiz').hidden)quizTick(dt);
  if(!$('vForm').hidden){if(fk<1)fk=Math.min(1,fk+dt/1.3);drawForm()}
  requestAnimationFrame(loop)}
$('lang').onchange=e=>{lang=e.target.value;store.set('ttsc_lang',lang);applyLang()};
applyLang();route();requestAnimationFrame(loop);
</script>
</html>
